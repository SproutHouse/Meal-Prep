/* The plan's numbers were costed and counted for its own attendance map.
   If the user has since changed who eats when, say so instead of implying the figures moved. */
function attendanceDrift(){
  const plan = SEED.planSlotP || {};
  const now = DAYS.reduce((t,d) => t + MEALS.reduce((u,[m]) => u + slotP(d,m), 0), 0);
  const planned = DAYS.reduce((t,d) => t + MEALS.reduce((u,[m]) => u + ((plan[d]||{})[m] || 0), 0), 0);
  const moved = DAYS.some(d => MEALS.some(([m]) => Math.abs(slotP(d,m) - ((plan[d]||{})[m] || 0)) > 0.005));
  if (!moved) return null;
  const n = el("div","banner");
  n.innerHTML = `<span class="ico">↻</span><div><p><b>Attendance has changed since this plan was generated.</b>
    Recipe quantities below follow your edits (${now.toFixed(2)} P across the week vs ${planned.toFixed(2)} P planned),
    but the <b>nutrition table, shopping list and budget are the plan's originals</b> — they do not recost themselves.
    Copy the brief from Setup and regenerate the week to bring them in line.</p></div>`;
  return n;
}

/* ── WEEK ────────────────────────────────────────────────────────── */
function renderWeek(){
  const p = $("#pane-week"); p.innerHTML = "";

  p.appendChild(dietBanner());
  const drift = attendanceDrift();
  if (drift) p.appendChild(drift);

  const sec = el("div","sec");
  const home = W.menu.filter(r => !r.is_out).length, out = W.menu.filter(r => r.is_out).length;
  const plannedL = W.menu.filter(r => r.lunchKey).length;
  sec.innerHTML = `<div class="sec-head"><h2>The week</h2><span class="hint">
    ${home} home suppers · ${out} restaurant · ${plannedL} planned lunches · ${W.plants_count} distinct plants</span></div>`;
  const wrap = el("div","menu-wrap");
  const head = el("div","menu-head");
  ["Day","Breakfast","Lunch","Supper"].forEach(h => head.appendChild(el("div", null, h)));
  wrap.appendChild(head);
  W.menu.forEach(row => {
    const r = el("div","menu-row");
    const day = el("div","menu-day");
    day.innerHTML = `<b>${esc(row.day)}</b><span class="mono" style="font-size:10px; color:var(--faint)">${esc(row.style)}</span>`;
    r.appendChild(day);
    r.appendChild(menuCell(row.breakfast, row.breakfastKey, row.day, "B"));
    r.appendChild(menuCell(row.lunch, row.lunchKey, row.day, "L"));
    const eff = supperKey(row), effD = eff ? byKey[eff] : null;
    const din = menuCell(effD ? effD.dish : row.dinner, eff, row.day, "D");
    if (!row.is_out){
      const meta = din.querySelector(".meta");
      if (state.swaps[row.day]) meta.appendChild(el("span","chip warn","swapped"));
      const sb = el("button","swapbtn", "⇄ swap"); sb.setAttribute("aria-expanded","false"); sb.dataset.fk = "swap:" + row.day;
      const pk = el("div","picker"); pk.hidden = true;
      const opt = (key, label, sub) => {
        const b = el("button"); b.innerHTML = `<span>${esc(label)}</span><span class="src">${esc(sub)}</span>`;
        b.setAttribute("aria-current", String(eff === key)); b.onclick = () => setSwap(row.day, key); return b; };
      pk.appendChild(opt(row.dinnerKey, "Plan: " + byKey[row.dinnerKey].dish, byKey[row.dinnerKey].source_rating || "plan"));
      ALTS().forEach(a => pk.appendChild(opt(a.key, a.dish, a.source_rating || "alternate")));
      sb.onclick = () => { pk.hidden = !pk.hidden; sb.setAttribute("aria-expanded", String(!pk.hidden)); };
      meta.appendChild(sb); din.appendChild(pk);
    }
    if (effD && effD.diet === "Vegetarian") din.querySelector(".meta").prepend(el("span","chip veg","vegetarian"));
    if (row.is_grill) din.querySelector(".meta").appendChild(el("span","chip grill","charcoal"));
    if (row.is_out) din.querySelector(".meta").appendChild(el("span","chip plain","out — off envelope"));
    r.appendChild(din);
    wrap.appendChild(r);
  });
  sec.appendChild(wrap);
  p.appendChild(sec);

  /* batch components */
  const bc = el("div","sec");
  bc.innerHTML = `<div class="sec-head"><h2>Sunday batch components</h2>
    <span class="hint">Each reused across ≥2 meals — the architecture the week hangs on.</span></div>`;
  const bp = el("div","panel");
  bp.innerHTML = W.batch_components.map(t => `<p style="padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13px">${esc(t)}</p>`).join("")
    .replace(/border-bottom:1px solid var\(--line-soft\)("[^>]*>)([^<]*)<\/p>$/, "border-bottom:0$1$2</p>");
  bc.appendChild(bp);
  p.appendChild(bc);

  p.appendChild(alternatesSection());
  p.appendChild(nutritionSection());
  p.appendChild(budgetSection());
}

/* The household's own requests, kept as full recipes off the grid. Swap any of them into a home supper. */
function alternatesSection(){
  const sec = el("div","sec");
  const alts = ALTS();
  sec.innerHTML = `<div class="sec-head"><h2>Alternates</h2>
    <span class="hint">Your requests, ready to swap into any home supper — or use ⇄ swap on the grid.</span></div>`;
  if (!alts.length){ sec.appendChild(el("p","empty","No alternates in this plan.")); return sec; }
  const g = el("div","altgrid");
  alts.forEach(a => {
    const c = el("div","alt");
    const placed = Object.entries(state.swaps).filter(([,k]) => k === a.key).map(([d]) => d);
    c.innerHTML = `<div class="dt" style="display:flex; gap:9px; align-items:flex-start">
        <span class="ico" style="font-size:19px">${esc(a.icon||"🍽️")}</span>
        <div style="min-width:0"><h3 style="font-size:13.8px; line-height:1.35">${esc(a.dish)}</h3>
          <div class="note" style="margin-top:2px">${esc(a.source_name||"")} · <span class="mono">${esc(a.source_rating||"")}</span></div></div></div>
      <div class="foot" style="display:flex; gap:5px; flex-wrap:wrap">
        <span class="chip ${dietClass(a.diet)}">${esc(a.diet)}</span><span class="chip plain">${esc(a.cuisine)}</span>
        <span class="chip plain mono">${a.per_p[0]} kcal / P</span>
        ${placed.length ? `<span class="chip warn">on ${esc(placed.join(", "))}</span>` : ""}</div>`;
    const use = el("div","use");
    use.appendChild(el("span","eyebrow","Use on"));
    W.menu.filter(r => !r.is_out).forEach(r => {
      const b = el("button", null, r.day); b.setAttribute("aria-pressed", String(state.swaps[r.day] === a.key));
      b.onclick = () => setSwap(r.day, state.swaps[r.day] === a.key ? null : a.key); use.appendChild(b);
    });
    c.appendChild(use);
    const open = el("button","btn sm","Open recipe"); open.onclick = () => openDish(a.key, placed[0]); c.appendChild(open);
    g.appendChild(c);
  });
  sec.appendChild(g);
  return sec;
}

const SLOTNAME = { B:"Breakfast", L:"Lunch", D:"Supper" };
function menuCell(text, key, day, meal){
  const c = el("div","menu-cell");
  c.dataset.slot = SLOTNAME[meal] || "";
  if (key && byKey[key]){
    const b = el("button","dishlink", text);
    b.onclick = () => openDish(key, day, meal);
    c.appendChild(b);
  } else {
    c.appendChild(el("p","plain-txt", text));
  }
  c.appendChild(el("div","meta"));
  return c;
}

function nutritionSection(){
  const sec = el("div","sec");
  sec.innerHTML = `<div class="sec-head"><h2>Nutrition</h2>
    <span class="hint">Derived from recipe quantities · CNF/USDA estimates, not medical advice</span></div>`;
  const planIds = SEED.planEaterIds || [];
  const rosterChanged = state.eaters.length !== planIds.length || state.eaters.some((e,i) => e.id !== planIds[i]);
  if (rosterChanged){
    const b = el("div","banner");
    b.innerHTML = `<span class="ico">↻</span><div><p><b>Roster changed.</b> These figures were modelled for the plan's
      ${planIds.length} eaters. Anyone added since shows no data — copy the brief from Setup and regenerate the week.</p></div>`;
    sec.appendChild(b);
  }
  if (!W.nutrition || !W.nutrition.length || !W.nutrition[0].per){
    sec.appendChild(el("p","empty","This plan has no per-eater nutrition.")); return sec;
  }
  const eaters = state.eaters;
  const head = eaters.map(e => {
    const d = derive(e);
    return `<th class="n">${esc(e.name)}${e.placeholder ? ' <span class="chip warn" style="font-size:9.5px">placeholder</span>' : ""}
      <div style="font-weight:400; text-transform:none; letter-spacing:0; margin-top:3px">${d.kcal} kcal · ${d.proteinMin}–${d.proteinMax} g pro</div></th>`;
  }).join("");
  const rows = W.nutrition.map(r => {
    const cells = eaters.map(e => {
      const cv = coverage(r, e);
      if (!cv) return `<td class="n" style="color:var(--faint)">—</td>`;
      const pct = Math.round(cv.pct * 100);
      const col = r.restaurant ? "var(--muted)" : inBand(cv) ? "var(--good)" : "var(--bad)";
      return `<td class="n"><div><b>${cv.kcal}</b> kcal</div>
        <div style="color:${col}; font-weight:600">${pct}%</div>
        <div style="color:var(--faint); font-size:11px">${cv.pro} g pro · ${esc(cv.counted)}</div></td>`;
    }).join("");
    return `<tr><td>${esc(r.day)}${r.restaurant ? '<div class="note">🍽 supper out</div>' : ""}</td>${cells}</tr>`;
  }).join("");
  const tw = el("div","tw");
  tw.innerHTML = `<table><thead><tr><th>Day</th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  sec.appendChild(tw);
  const imp = W.improvisedLunchPerP || [450,22,5];
  const n = el("p","note");
  n.innerHTML = `Each cell is what that person's <b>counted</b> meals supply, as a percentage of the share of their daily
    target those meals should cover (breakfast 25 %, lunch 30 %, supper 35 % — snacks are never planned).
    <b>Green</b> is inside ±10 %; <b>red</b> is outside. Codes: <b>B</b> breakfast · <b>L</b> planned lunch ·
    <b>L~</b> improvised lunch, counted as a small plate (~${imp[0]} kcal per portion unit) · <b>L(left)</b> leftovers ·
    <b>D</b> home supper. Parents' breakfasts are their own and aren't counted; restaurant suppers aren't counted, so those
    days read as partial. Update anyone's stats in Setup and these percentages recompute.`;
  sec.appendChild(n);
  return sec;
}

function budgetSection(){
  const sec = el("div","sec");
  const env = state.budgetPerDay * PLAN_DAYS;
  const b = W.budget;
  const under = b.consumed_cad <= env;
  sec.innerHTML = `<div class="sec-head"><h2>Budget</h2><span class="hint">Two views — what you pay, and what you eat.</span></div>`;
  const grid = el("div","grid"); grid.style.gridTemplateColumns = "repeat(auto-fit,minmax(230px,1fr))";
  const cards = [
    { k:"Consumed this week", v:money(b.consumed_cad), s:`${money(b.per_cooked_day_cad)} / cooked day`,
      chip: under ? ["good", `under by ${money(env - b.consumed_cad)}`] : ["bad", `over by ${money(b.consumed_cad - env)}`] },
    { k:"Envelope", v:money(env), s:`${money(state.budgetPerDay)}/day × 7 · hard gate`, chip:null },
    { k:"Cash-out at the register", v:money(b.cash_out_cad), s:"incl. bulk + durables", chip:["warn","bulk week"] }
  ];
  cards.forEach(c => {
    const n = el("div","panel");
    n.innerHTML = `<span class="eyebrow">${esc(c.k)}</span>
      <div style="font-family:var(--f-display); font-size:25px; font-weight:600; letter-spacing:-.03em; margin:5px 0 3px" class="num">${esc(c.v)}</div>
      <div class="note">${esc(c.s)}</div>
      ${c.chip ? `<div style="margin-top:8px"><span class="chip ${c.chip[0]}">${esc(c.chip[1])}</span></div>` : ""}`;
    grid.appendChild(n);
  });
  sec.appendChild(grid);
  const note = el("p","note");
  note.textContent = b.note;
  sec.appendChild(note);
  const listTotal = W.shopping.reduce((s,x) => s + (x.price_cad||0), 0);
  if (Math.abs(listTotal - b.cash_out_cad) > 0.01){
    const r = el("p","note");
    r.innerHTML = `The Shopping tab's line items add to <b class="num">${money(listTotal)}</b> against this
      <b class="num">${money(b.cash_out_cad)}</b> cash-out — the brief rounded each store's subtotal
      (${money(listTotal)} → ${money(b.cash_out_cad)}).`;
    sec.appendChild(r);
  }
  return sec;
}

/* ── RECIPES ─────────────────────────────────────────────────────── */
const filters = { meal:"", cuisine:"", diet:"", method:"", verdict:"", group:"meal" };
function renderRecipes(){
  const p = $("#pane-recipes"); p.innerHTML = "";
  const sec = el("div","sec");
  sec.innerHTML = `<div class="sec-head"><h2>Recipes</h2>
    <span class="hint">Quantities rescale to whoever is actually eating.</span></div>`;
  const uniq = f => [...new Set(DISHES.flatMap(d => Array.isArray(d[f]) ? d[f] : [d[f]]).filter(Boolean))];
  const fr = el("div","filters");
  const sel = (id, label, opts, val) =>
    `<select data-fl="${id}" aria-label="${label}"><option value="">${label}: all</option>${
      opts.map(o => `<option value="${esc(o)}"${val === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  fr.innerHTML = sel("meal","Meal",uniq("meal"),filters.meal) + sel("cuisine","Cuisine",uniq("cuisine"),filters.cuisine)
    + sel("diet","Diet",uniq("diet"),filters.diet) + sel("method","Method",uniq("methods"),filters.method)
    + sel("verdict","Verdict",["Untried","✅ Success","❌ Failed"],filters.verdict)
    + `<select data-fl="group" aria-label="Group by"><option value="meal"${filters.group==="meal"?" selected":""}>Group: meal</option>
       <option value="cuisine"${filters.group==="cuisine"?" selected":""}>Group: cuisine</option>
       <option value="diet"${filters.group==="diet"?" selected":""}>Group: diet</option>
       <option value="verdict"${filters.group==="verdict"?" selected":""}>Group: verdict</option>
       <option value="none"${filters.group==="none"?" selected":""}>Group: none</option></select>`;
  fr.querySelectorAll("[data-fl]").forEach(s => s.onchange = () => { filters[s.dataset.fl] = s.value; renderRecipes(); });
  sec.appendChild(fr);
  p.appendChild(sec);

  let list = DISHES.filter(d =>
    (!filters.meal || d.meal === filters.meal) && (!filters.cuisine || d.cuisine === filters.cuisine) &&
    (!filters.diet || d.diet === filters.diet) && (!filters.method || (d.methods||[]).includes(filters.method)) &&
    (!filters.verdict || state.feedback[d.key].verdict === filters.verdict));

  if (!list.length){ p.appendChild(el("p","empty","No dishes match these filters.")); return; }

  const groups = filters.group === "none" ? { "All dishes": list }
    : list.reduce((acc,d) => {
        const k = (d.alternate && filters.group === "meal") ? "Alternates — swap into any supper"
          : filters.group === "verdict" ? state.feedback[d.key].verdict : (d[filters.group] || "Other");
        (acc[k] = acc[k] || []).push(d); return acc; }, {});
  Object.entries(groups).forEach(([k, items]) => {
    const g = el("div","sec");
    g.innerHTML = `<div class="sec-head"><h2 style="font-size:13px">${esc(k)}
      <span class="mono" style="font-size:11px; color:var(--faint); font-weight:400"> ${items.length}</span></h2></div>`;
    const grid = el("div","dishgrid");
    items.forEach(d => grid.appendChild(dishCard(d)));
    g.appendChild(grid);
    p.appendChild(g);
  });
}

function dishCard(d){
  const c = el("button","dish");
  const sc = dishScale(d);
  const fb = state.feedback[d.key];
  const scaleTag = sc.kind === "jars"
    ? `<span class="chip plain mono">× ${sc.jars} servings</span>`
    : (Math.abs(sc.factor - 1) > 0.02 ? `<span class="chip plain mono">× ${sc.factor.toFixed(2)}</span>` : "");
  c.innerHTML = `
    <div class="dt"><span class="ico">${esc(d.icon || "🍽️")}</span>
      <div style="min-width:0"><h3>${esc(d.dish)}</h3>
        <div class="when">${esc(d.meal)} · ${d.days.length ? esc(d.days.join(", ")) : "alternate"}</div></div></div>
    <p class="note" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">${esc(d.intro || "")}</p>
    <div class="foot">
      <span class="chip ${dietClass(d.diet)}">${esc(d.diet)}</span>
      <span class="chip plain">${esc(d.cuisine)}</span>
      ${(d.methods||[]).map(m => `<span class="chip ${/Grill/.test(m) ? "grill" : "plain"}">${esc(m)}</span>`).join("")}
      ${scaleTag}
      ${fb.verdict !== "Untried" ? `<span class="chip ${fb.verdict.includes("Success") ? "good" : "bad"}">${esc(fb.verdict)}</span>` : ""}
    </div>`;
  c.onclick = () => openDish(d.key);
  return c;
}

/* ── drawer ──────────────────────────────────────────────────────── */
function openDish(key, day, meal, opts){
  const d = byKey[key]; if (!d) return;
  if (!(opts && opts.keepToggle)) state.scaleOn = true;     // the toggle is per-dish, not sticky
  if (!(opts && opts.keepToggle)) openDish._origin = document.activeElement;
  const sc = dishScale(d, day);
  $("#dwIco").textContent = d.icon || "🍽️";
  $("#dwTitle").textContent = d.dish;
  $("#dwWhen").textContent = `${d.meal} · ${d.days.length ? d.days.join(", ") : (day ? "swapped onto " + day : "alternate — not on the grid")} · ${d.cuisine} · ${d.diet}`;
  const b = $("#dwBody"); b.innerHTML = "";

  if (d.intro){ const i = el("p","note"); i.style.fontSize = "13px"; i.textContent = d.intro; b.appendChild(i); }

  const bar = el("div","scalebar");
  if (sc.kind === "jars"){
    bar.innerHTML = `<span>Quantities are <b>per serving</b>. This week needs <b>${sc.jars}</b>
      ${sc.jars === 1 ? "serving" : "servings"} — ${esc(d.days.join(", "))} × whoever gets a prepped breakfast.
      A serving is the same for anyone, so a smaller eater's isn't scaled down.</span>`;
  } else if (sc.covered <= 0){
    bar.innerHTML = `<span>Nobody is down for this meal — quantities shown <b>as written</b>. Add someone in Setup to scale it.</span>`;
  } else {
    const feedTxt = (sc.feeds && sc.feeds.length)
      ? ` plus the leftover ${sc.feeds.map(f => f[0] + " lunch").join(" & ")}`
      : "";
    bar.innerHTML = Math.abs(sc.factor - 1) > 0.02
      ? `<span>Written to cover <b>${sc.basis.toFixed(2)} P</b> (this meal${feedTxt}) · you now need
           <b>${sc.covered.toFixed(2)} P</b> → ${state.scaleOn
             ? `scaled <b>× ${sc.factor.toFixed(2)}</b>`
             : `showing the <b>original</b> quantities`}.</span>
         <button class="btn sm" id="tglScale">${state.scaleOn ? "Show original" : "Show scaled"}</button>`
      : `<span>Covering <b>${sc.covered.toFixed(2)} P</b> (this meal${feedTxt}) — matches the quantities as written.</span>`;
  }
  b.appendChild(bar);

  if (d.reconstructed){
    const w = el("div","banner"); w.innerHTML = `<span class="ico">ℹ️</span><div><p>${esc(d.reconstructed)}</p></div>`;
    b.appendChild(w);
  }

  const f = (sc.kind === "jars" || !state.scaleOn || !(sc.covered > 0)) ? 1 : sc.factor;
  const ings = el("div");
  ings.appendChild(el("h4", null, "Ingredients"));
  const ul = el("ul","ing");
  d.ingredients.forEach(line => {
    const r = scaleLine(line, f);
    const li = el("li");
    li.innerHTML = md(r.text)
      + (r.changed && r.subs.length ? ` <span class="was">was ${esc(r.subs.join(", "))}</span>` : "")
      + (!r.changed && r.skipped && f !== 1 ? ` <span class="was">pack size — not scaled</span>` : "");
    ul.appendChild(li);
  });
  ings.appendChild(ul); b.appendChild(ings);

  const st = el("div");
  st.appendChild(el("h4", null, "Method"));
  const ol = el("ol","steps");
  d.steps.forEach(s => { const li = el("li"); li.innerHTML = `<span>${md(s)}</span>`; ol.appendChild(li); });
  st.appendChild(ol); b.appendChild(st);

  if ((d.house_notes||[]).length){
    const hn = el("div");
    hn.appendChild(el("h4", null, "House notes"));
    const ul2 = el("ul","hnotes");
    d.house_notes.forEach(t => { const li = el("li"); li.innerHTML = md(t); ul2.appendChild(li); });
    hn.appendChild(ul2); b.appendChild(hn);
  }

  /* verdict + notes */
  const fbWrap = el("div");
  fbWrap.appendChild(el("h4", null, "After you cook it"));
  const fb = state.feedback[d.key];
  fbWrap.appendChild(verdictControl(d.key, () => { openDish(key, day, meal, {keepToggle:true}); renderAll(); }));
  const ta = el("textarea"); ta.placeholder = "What you liked, what to change next time — the agent reads this.";
  ta.setAttribute("aria-label", "Notes for " + d.dish);
  ta.value = fb.notes; ta.style.marginTop = "9px";
  ta.oninput = () => { state.feedback[d.key].notes = ta.value; };
  ta.onchange = () => { saveFeedback(d.key); renderAll(); };
  fbWrap.appendChild(ta);
  b.appendChild(fbWrap);

  if (d.source_url){
    const s = el("p","note");
    s.innerHTML = `📖 Source recipe: <a href="${esc(d.source_url)}" target="_blank" rel="noopener">${esc(d.source_name || "link")} ↗</a>`
      + (d.source_rating ? ` <span class="mono" style="color:var(--faint)">${esc(d.source_rating)}</span>` : "");
    b.appendChild(s);
  }
  const nl = el("p","note");
  nl.innerHTML = `<a href="${esc(d.notion_url)}" target="_blank" rel="noopener">Open this card in Notion ↗</a>`;
  b.appendChild(nl);

  const tgl = document.getElementById("tglScale");
  if (tgl) tgl.onclick = () => { state.scaleOn = !state.scaleOn; openDish(key, day, meal, {keepToggle:true}); };

  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open");
}
function closeDrawer(){
  const dw = $("#drawer"), a = document.activeElement;
  if (a && dw.contains(a)){            // commit an in-progress note, then leave the subtree
    if (typeof a.blur === "function") a.blur();
    a.dispatchEvent(new Event("change"));
  }
  dw.classList.remove("open"); dw.setAttribute("aria-hidden","true");
  $("#scrim").classList.remove("open");
  if (openDish._origin && document.body.contains(openDish._origin)) openDish._origin.focus({preventScroll:true});
}

/* ── SHOPPING ────────────────────────────────────────────────────── */

    <div><span class="eyebrow">List total</span>
      <div class="num" style="font-family:var(--f-display); font-size:23px; font-weight:600">${money(total)}</div></div>
    <p class="note" style="flex:1; min-width:210px">Every price carries its source. Lines marked

  p.appendChild(sec);

  if (active.length){
    const b = el("div","banner");
    b.innerHTML = `<span class="ico">⇄</span><div><p><b>This list is for the plan as written.</b> You've swapped in
      ${active.map(([d,k]) => `<b>${esc(byKey[k].dish)}</b> on ${esc(d)}`).join(", ")} — add its ingredients from the recipe card,
      and drop the ones for ${active.map(([d]) => { const r = W.menu.find(x => x.day === d); return esc(byKey[r.dinnerKey].dish); }).join(", ")}.</p></div>`;
    p.appendChild(b);
  }
  const stores = [...new Set(W.shopping.map(x => x.store))];
  stores.forEach(store => {
    const items = W.shopping.map((x,i) => ({...x, i})).filter(x => x.store === store);
    const st = W.store_totals.find(t => t.store === store);
    const box = el("div","tw"); box.style.padding = "0";
    const head = el("div","store-head");
    head.innerHTML = `<div><h3>${esc(store)}</h3>
        <span class="note">${esc(st?.note || "")}</span></div>
      <span class="tot num">${money(items.reduce((s,x) => s + (x.price_cad||0), 0))}</span>`;
    if (st && typeof st.lines_sum === "number" && Math.abs(st.lines_sum - st.total_cad) > 0.01){
      const d = el("p","note");
      d.style.cssText = "padding:8px 14px 0";
      d.innerHTML = `These lines add to <b class="num">${money(st.lines_sum)}</b>; the brief states
        <b class="num">${money(st.total_cad)}</b> for this store — the gap is the brief's own rounding.`;
      box.appendChild(d);
    }
    box.appendChild(head);
    const cats = [...new Set(items.map(x => x.category))];
    cats.forEach(cat => {
      box.appendChild(el("div","cat-head", cat));
      items.filter(x => x.category === cat).forEach(x => {
        const line = el("div","shop-line" + (state.shopChecked[x.i] ? " done" : ""));
        const cb = el("input"); cb.type = "checkbox"; cb.checked = !!state.shopChecked[x.i];
        cb.setAttribute("aria-label", "Bought " + x.item);
        cb.dataset.fk = "shop:" + x.i;
        cb.onchange = () => { state.shopChecked[x.i] = cb.checked; saveWeek(); renderShopping(); };
        const mid = el("div");
        mid.innerHTML = `<div class="nm">${esc(x.item)} ${x.is_grill_item ? '<span class="chip grill">🔥</span>' : ""}</div>
          <div class="qt">${esc(x.qty || "")}${x.note ? " · " + esc(x.note) : ""}</div>`;
        const pr = el("div","pr");
        pr.innerHTML = `${money(x.price_cad)}<span class="src">${esc(x.source_label || "source unrecorded")}</span>`;
        line.append(cb, mid, pr);
        box.appendChild(line);
      });
    });
    p.appendChild(box);
  });

  /* price book */
  const pb = el("div","sec");
  pb.innerHTML = `<div class="sec-head"><h2>Price book</h2>
    <span class="hint">${SEED.prices.items.length} staples · one Walmart.ca scrape, 18 Jul 2026 — a baseline, not a live feed.</span></div>`;
  const search = el("input"); search.type = "text"; search.placeholder = "Search staples — poulet, tofu, riz…";
  search.style.maxWidth = "320px"; search.dataset.fk = "pbsearch";
  search.setAttribute("aria-label","Search the price book");
  search.value = state.pbQuery || "";
  pb.appendChild(search);
  const tw = el("div","tw");
  const draw = q => {
    const rows = SEED.prices.items
      .filter(it => !q || (it.item + " " + (it.brand_format||"") + " " + it.category).toLowerCase().includes(q.toLowerCase()))
      .map(it => `<tr><td>${esc(it.item)}<div class="note">${esc(it.brand_format||"")}</div></td>
        <td class="n">${money(it.price_cad)}</td><td class="n">${esc(it.unit_price||"—")}</td>
        <td><span class="chip ${it.source === "est" ? "warn" : "plain"}">${esc(it.source)}</span></td>
        <td class="note">${esc(it.category)}</td></tr>`).join("");
    tw.innerHTML = `<table><thead><tr><th>Item</th><th class="n">Price</th><th class="n">Unit</th><th>Source</th><th>Category</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Nothing matches.</td></tr>'}</tbody></table>`;
  };
  draw(state.pbQuery || "");
  search.oninput = () => { state.pbQuery = search.value; draw(search.value); };
  pb.appendChild(tw);
  p.appendChild(pb);
}

/* ── PREP DAY ────────────────────────────────────────────────────── */
function renderPrep(){
  const p = $("#pane-prep"); p.innerHTML = "";
  const done = Object.values(state.prepChecked).filter(Boolean).length;
  const sec = el("div","sec");
  sec.innerHTML = `<div class="sec-head"><h2>${esc(W.prep_day_label || "Sunday run-sheet")}</h2>
    <span class="hint">Longest-lead first · ${done}/${W.runsheet.length} done</span></div>`;
  const box = el("div","tw");
  W.runsheet.forEach((r,i) => {
    const line = el("div","run" + (state.prepChecked[i] ? " done" : ""));
    const ck = el("div","ck");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = !!state.prepChecked[i];
    cb.setAttribute("aria-label","Done: " + r.task);
    cb.dataset.fk = "prep:" + i;
    cb.onchange = () => { state.prepChecked[i] = cb.checked; saveWeek(); renderPrep(); };
    ck.append(cb, el("span","t", r.time));
    line.appendChild(ck);
    const taskEl = el("div","task", r.task);
    const jarsNeeded = DISHES.filter(x => x.meal === "Breakfast")
      .reduce((t,x) => t + x.days.reduce((u,day) => u + eatersAt(day,"B").length, 0), 0);
    const m = r.task.match(/Assemble (\d+) mason jars/);
    if (m && +m[1] !== jarsNeeded){
      const w = el("p","note"); w.style.marginTop = "4px";
      w.innerHTML = `The brief says ${esc(m[1])}; your current roster needs <b>${jarsNeeded}</b>
        (one jar per person per breakfast).`;
      taskEl.appendChild(w);
    }
    line.appendChild(taskEl);
    const lab = el("span","lbl", r.label === "—" ? "" : r.label);
    if (r.label && r.label !== "—") lab.dataset.k = r.label;
    line.appendChild(lab);
    box.appendChild(line);
  });
  sec.appendChild(box);
  p.appendChild(sec);

  const mid = el("div","sec");
  mid.innerHTML = `<div class="sec-head"><h2>Midweek</h2><span class="hint">Short cook nights — the plan doesn't span the week on Sunday alone.</span></div>`;
  const mp = el("div","panel");
  mp.innerHTML = W.midweek_notes.map(t =>
    `<p style="padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13px; line-height:1.5">${esc(t)}</p>`).join("");
  mid.appendChild(mp); p.appendChild(mid);

  const jr = el("div","sec");
  jr.innerHTML = `<div class="sec-head"><h2>Breakfast bank</h2><span class="hint">Prepped on ${esc(W.prep_day || "Sun")} for whoever gets a prepped breakfast</span></div>`;
  const jg = el("div","jars");
  W.jars.forEach(j => {
    const key = j.key || DISHES.find(d => d.dish.startsWith(j.id))?.key;
    const key0 = j.key || DISHES.find(d => d.dish.startsWith(j.id))?.key;
    const c = el(key0 ? "button" : "div","jar");
    if (key0) c.style.textAlign = "left";
    const sp = j.freezer ? null : jarSpan(j);
    const spCls = j.freezer ? "fish" : sp <= 4 ? "plain" : sp === 5 ? "warn" : "bad";
    c.innerHTML = `<span class="id">${esc(j.id)} · ${esc(j.days)}</span>
      <h3>${esc(j.name)}</h3>
      <p class="layers">${esc(j.layers)}</p>
      <div class="row"><span>lid-cup: ${esc(j.lid_cup)}</span>
        <span class="chip ${spCls} mono">${j.freezer ? "freezer" : sp + " fridge-days" + (sp > 5 ? " · over cap" : "")}</span></div>`;
    if (key){ c.style.cursor = "pointer"; c.onclick = () => openDish(key); }
    jg.appendChild(c);
  });
  jr.appendChild(jg); p.appendChild(jr);

  const fs = el("div","sec");
  fs.innerHTML = `<div class="sec-head"><h2>Food safety</h2></div>`;
  const fp = el("div","panel");
  fp.innerHTML = `<p style="font-size:13px; line-height:1.7">${esc(W.food_safety)}</p>`;
  fs.appendChild(fp); p.appendChild(fs);
}

/* A verdict control usable anywhere, not just at the bottom of a recipe. */
function verdictControl(key, onDone){
  const vs = el("div","vset");
  ["Untried","✅ Success","❌ Failed"].forEach(v => {
    const btn = el("button", null, v === "Untried" ? "Untried" : v);
    btn.dataset.v = v;
    btn.setAttribute("aria-pressed", String(state.feedback[key].verdict === v));
    btn.setAttribute("aria-label", `${v} — ${byKey[key] ? byKey[key].dish : key}`);
    btn.onclick = ev => {
      ev.stopPropagation();
      state.feedback[key].verdict = v; saveFeedback(key);
      toast(v === "❌ Failed" ? "Scrapped — it won't be suggested again"
          : v === "✅ Success" ? "Marked a keeper" : "Reset to untried");
      if (onDone) onDone(); else renderAll();
    };
    vs.appendChild(btn);
  });
  return vs;
}

/* ── FEEDBACK ────────────────────────────────────────────────────── */
function renderFeedback(){
  const p = $("#pane-feedback"); p.innerHTML = "";
  const sec = el("div","sec");
  sec.innerHTML = `<div class="sec-head"><h2>How the loop works</h2></div>`;
  const how = el("div","panel");
  how.innerHTML = `<ol style="margin:0; padding-left:19px; display:flex; flex-direction:column; gap:7px; font-size:13px; line-height:1.55">
    <li>After you cook a dish, open its card and set <b>Verdict</b> → ✅ Success or ❌ Failed, and jot <b>Notes</b>.</li>
    <li>Next time the agent plans, the brief carries your notes and verdicts back to it.</li>
    <li><b>Anything marked ❌ Failed is scrapped — the agent never suggests that recipe again.</b> ✅ Success plus your
        notes teach it what to lean into.</li></ol>`;
  sec.appendChild(how); p.appendChild(sec);

  const board = el("div","sec");
  board.innerHTML = `<div class="sec-head"><h2>Triage</h2><span class="hint">Tap a card to open it and set a verdict.</span></div>`;
  const b = el("div","board");
  [["Untried","plain"],["✅ Success","good"],["❌ Failed","bad"]].forEach(([v,cls]) => {
    const items = DISHES.filter(d => state.feedback[d.key].verdict === v);
    const col = el("div","col");
    col.innerHTML = `<header><h3>${esc(v)}</h3><span class="n">${items.length}</span></header>`;
    if (!items.length) col.appendChild(el("p","empty", v === "Untried" ? "Everything judged." : "Nothing here yet."));
    items.forEach(d => {
      const m = el("button","mini");
      m.innerHTML = `<b>${esc(d.icon||"")} ${esc(d.dish)}</b>
        <div style="display:flex; gap:5px; flex-wrap:wrap">
          <span class="chip ${dietClass(d.diet)}">${esc(d.diet)}</span>
          <span class="chip plain">${esc(d.cuisine)}</span></div>
        ${state.feedback[d.key].notes ? `<p class="note">"${esc(state.feedback[d.key].notes)}"</p>` : ""}`;
      m.onclick = () => openDish(d.key);
      const wrap = el("div"); wrap.style.cssText = "display:flex; flex-direction:column; gap:6px";
      wrap.appendChild(m);
      wrap.appendChild(verdictControl(d.key));
      col.appendChild(wrap);
    });
    b.appendChild(col);
  });
  board.appendChild(b); p.appendChild(board);

  /* ban list export */
  const banned = DISHES.filter(d => state.feedback[d.key].verdict === "❌ Failed");
  const loved = DISHES.filter(d => state.feedback[d.key].verdict === "✅ Success");
  const ex = el("div","sec");
  ex.innerHTML = `<div class="sec-head"><h2>Write back to the agent's files</h2>
    <span class="hint">Paste into BANNED_RECIPES.md and TASTE_NOTES.md, or let <code>/household-sync</code> do it.</span></div>`;
  const xp = el("div","panel");
  const banTxt = banned.length
    ? banned.map(d => `- ${d.dish} · scrapped ${todayISO()} · ${state.feedback[d.key].notes || "no reason given"}`).join("\n")
    : "(none yet — nothing has been marked ❌ Failed)";
  const tasteTxt = loved.length || DISHES.some(d => state.feedback[d.key].notes)
    ? [...loved.map(d => `${todayISO()} · ${d.dish} · ✅ worked${state.feedback[d.key].notes ? " — " + state.feedback[d.key].notes : ""}`),
       ...DISHES.filter(d => state.feedback[d.key].notes && state.feedback[d.key].verdict !== "✅ Success")
         .map(d => `${todayISO()} · ${d.dish} · ${state.feedback[d.key].notes}`)].join("\n")
    : "(none yet)";
  const pre1 = el("pre","brief"); pre1.textContent = "## Scrapped\n" + banTxt;
  const pre2 = el("pre","brief"); pre2.textContent = "## Loved / notes\n" + tasteTxt;
  pre2.style.marginTop = "10px";
  const row = el("div"); row.style.cssText = "display:flex; gap:8px; margin-top:11px; flex-wrap:wrap";
  const c1 = el("button","btn","Copy scrap list");
  c1.onclick = async () => { try { await navigator.clipboard.writeText(banTxt); toast("Scrap list copied"); } catch { toast("Copy manually"); } };
  const c2 = el("button","btn","Copy taste notes");
  c2.onclick = async () => { try { await navigator.clipboard.writeText(tasteTxt); toast("Taste notes copied"); } catch { toast("Copy manually"); } };
  row.append(c1,c2);
  xp.append(pre1, pre2, row);
  ex.appendChild(xp);
  p.appendChild(ex);
  p.appendChild(syncNode());
}
const todayISO = () => new Date().toISOString().slice(0,10);

function syncNode(){
  const n = el("div","sync");
  n.innerHTML = `<span class="dot${(dbReady || localOk) ? " on" : ""}"></span>
    <span>${dbReady ? "Changes saved for next visit" : localOk ? "Saved on this device — other devices won't see them" : "Working locally — changes last for this visit only"}</span>`;
  return n;
}
function renderSync(){ document.querySelectorAll(".sync").forEach(n => n.replaceWith(syncNode())); }

/* ── boot ────────────────────────────────────────────────────────── */
function renderAll(){
  const a = document.activeElement;
  const fk = a && a.dataset ? a.dataset.fk : null;
  const caret = (a && typeof a.selectionStart === "number") ? a.selectionStart : null;
  renderTabs(); renderLedgers();
  if (state.tab === "setup") renderSetup();
  if (state.tab === "week") renderWeek();
  if (state.tab === "recipes") renderRecipes();
  if (state.tab === "shopping") renderShopping();
  if (state.tab === "prep") renderPrep();
  if (state.tab === "feedback") renderFeedback();
  if (fk){
    const back = document.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]');
    if (back){ back.focus({preventScroll:true});
      if (caret != null && typeof back.setSelectionRange === "function"){
        try { back.setSelectionRange(caret, caret); } catch {}
      } }
  }
}
$("#dwClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
/* This device's own memory (works without any sign-in). A saved roster only applies to the plan it was made for. */
function loadLocal(){
  const hh = LS.get("state/household");
  if (hh && hh.planWeek === W.week_id){
    if (Array.isArray(hh.eaters) && hh.eaters.length) state.eaters = hh.eaters;
    if (hh.attendance) state.attendance = hh.attendance;
    if (typeof hh.budgetPerDay === "number") state.budgetPerDay = hh.budgetPerDay;
    if (typeof hh.plantsTarget === "number") state.plantsTarget = hh.plantsTarget;
    state.eaters.forEach(e => { if (!state.attendance[e.id]) state.attendance[e.id] = seedAttendance([e.id])[e.id]; });
    localOk = true;
  }
  const wk = LS.get("state/week-" + slugSafe(W.week_id));
  if (wk){ state.shopChecked = wk.shopChecked || {}; state.prepChecked = wk.prepChecked || {};
    state.swaps = {}; Object.entries(wk.swaps || {}).forEach(([d,k]) => { if (byKey[k]) state.swaps[d] = k; }); localOk = true; }
  DISHES.forEach(d => { const f = LS.get("feedback/" + slugSafe(d.key)); if (f) { state.feedback[d.key] = { verdict: f.verdict || "Untried", notes: f.notes || "" }; localOk = true; } });
}
loadLocal();
renderAll();
initDb();
</script>
