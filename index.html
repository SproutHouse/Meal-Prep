<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E6B47">
<style>body{margin:0} img{max-width:100%}</style>
<title>Mise en Place</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* ── tokens: complete light palette on bare :root ─────────────────── */
:root{
  --ground:#EDF0EA; --surface:#FBFCF9; --raised:#F4F7F1;
  --ink:#141A15; --ink-2:#39463B; --muted:#5E6B60; --faint:#6B776C;
  --line:#D6DCD2; --line-soft:#E3E8DF;
  --accent:#1E6B47; --accent-ink:#FFFFFF; --accent-wash:#E2EDE6;
  --veg:#4E7F16; --veg-wash:#E9F0DC;
  --grill:#B54C1A; --grill-wash:#F6E5DA;
  --fish:#28647F; --fish-wash:#DFEAF0;
  --warn:#966A12; --warn-wash:#F5EBD6;
  --bad:#9E2F24; --bad-wash:#F6E0DC;
  --good:#1E6B47; --good-wash:#E2EDE6;
  --shadow:0 1px 2px rgba(20,26,21,.06), 0 8px 24px -12px rgba(20,26,21,.18);
  --r:10px; --r-sm:6px;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F130F; --surface:#171C17; --raised:#1D241E;
    --ink:#E7ECE4; --ink-2:#C2CCBF; --muted:#94A194; --faint:#8C9A8D;
    --line:#2A322B; --line-soft:#232B24;
    --accent:#57B283; --accent-ink:#08150E; --accent-wash:#16291F;
    --veg:#9BCB4A; --veg-wash:#1E2814;
    --grill:#E4833F; --grill-wash:#2E1D12;
    --fish:#6DB2D0; --fish-wash:#12242C;
    --warn:#D6A63F; --warn-wash:#2A2213;
    --bad:#E27065; --bad-wash:#2C1613;
    --good:#57B283; --good-wash:#16291F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0F130F; --surface:#171C17; --raised:#1D241E;
  --ink:#E7ECE4; --ink-2:#C2CCBF; --muted:#94A194; --faint:#8C9A8D;
  --line:#2A322B; --line-soft:#232B24;
  --accent:#57B283; --accent-ink:#08150E; --accent-wash:#16291F;
  --veg:#9BCB4A; --veg-wash:#1E2814;
  --grill:#E4833F; --grill-wash:#2E1D12;
  --fish:#6DB2D0; --fish-wash:#12242C;
  --warn:#D6A63F; --warn-wash:#2A2213;
  --bad:#E27065; --bad-wash:#2C1613;
  --good:#57B283; --good-wash:#16291F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none!important}   /* own it, don't rely on the host reset */
body{background:var(--ground); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.5;
     -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.015em;}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

/* ── shell ─────────────────────────────────────────────────────────── */
.app{max-width:1220px; margin:0 auto; padding:0 20px 72px}
.topbar{display:flex; flex-wrap:wrap; gap:18px 28px; align-items:center; justify-content:space-between;
        padding:20px 0 16px; border-bottom:1px solid var(--line)}
.brand{display:flex; gap:12px; align-items:center; min-width:0}
.mark{font-size:26px; line-height:1; filter:saturate(.9)}
.brand h1{font-size:21px; letter-spacing:-.025em}
.brand .sub{color:var(--muted); font-size:12.5px; margin-top:1px}
.brand .sub b{color:var(--ink-2); font-weight:500}

/* three ledgers */
.ledgers{display:flex; gap:10px; flex-wrap:wrap}
.ledger{display:flex; flex-direction:column; gap:3px; padding:8px 13px; background:var(--surface);
        border:1px solid var(--line); border-radius:var(--r); min-width:132px}
.ledger .lab{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint)}
.ledger .val{font-family:var(--f-display); font-size:17px; font-weight:600; letter-spacing:-.02em; display:flex; align-items:baseline; gap:5px}
.ledger .val small{font-family:var(--f-mono); font-size:11px; font-weight:400; color:var(--muted); letter-spacing:0}
.ledger .bar{height:3px; border-radius:2px; background:var(--line-soft); overflow:hidden; margin-top:2px}
.ledger .bar i{display:block; height:100%; background:var(--accent); border-radius:2px}
.ledger.is-good .val{color:var(--good)} .ledger.is-good .bar i{background:var(--good)}
.ledger.is-warn .val{color:var(--warn)} .ledger.is-warn .bar i{background:var(--warn)}
.ledger.is-bad  .val{color:var(--bad)}  .ledger.is-bad  .bar i{background:var(--bad)}

/* tabs */
.tabs{display:flex; gap:2px; overflow-x:auto; padding:10px 0 0; border-bottom:1px solid var(--line); margin-bottom:24px}
.tab{appearance:none; background:none; border:0; border-bottom:2px solid transparent; padding:9px 14px 11px;
     color:var(--muted); font-weight:500; cursor:pointer; white-space:nowrap; font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tab .cnt{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); margin-left:5px}

/* structure */
.stack{display:flex; flex-direction:column; gap:26px}
.sec{display:flex; flex-direction:column; gap:12px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap}
.sec-head h2{font-size:15.5px}
.sec-head .hint{color:var(--muted); font-size:12.5px}
.eyebrow{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.grid{display:grid; gap:12px}
.note{color:var(--muted); font-size:12.5px; line-height:1.55}

/* banner */
.banner{display:flex; gap:12px; padding:13px 15px; border-radius:var(--r); background:var(--warn-wash);
        border:1px solid color-mix(in srgb, var(--warn) 30%, transparent); align-items:flex-start}
.banner .ico{font-size:15px; line-height:1.3}
.banner b{color:var(--ink)}
.banner p{font-size:12.8px; color:var(--ink-2); line-height:1.6}

/* chips */
.chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:100px; font-size:11.5px;
      font-weight:600; white-space:nowrap; border:1px solid transparent}
.chip.veg{background:var(--veg-wash); color:var(--veg); border-color:color-mix(in srgb, var(--veg) 26%, transparent)}
.chip.grill{background:var(--grill-wash); color:var(--grill); border-color:color-mix(in srgb, var(--grill) 26%, transparent)}
.chip.fish{background:var(--fish-wash); color:var(--fish); border-color:color-mix(in srgb, var(--fish) 26%, transparent)}
.chip.plain{background:var(--raised); color:var(--muted); border-color:var(--line)}
.chip.good{background:var(--good-wash); color:var(--good); border-color:color-mix(in srgb, var(--good) 26%, transparent)}
.chip.bad{background:var(--bad-wash); color:var(--bad); border-color:color-mix(in srgb, var(--bad) 26%, transparent)}
.chip.warn{background:var(--warn-wash); color:var(--warn); border-color:color-mix(in srgb, var(--warn) 26%, transparent)}

/* buttons */
.btn{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:7px 12px;
     border-radius:var(--r-sm); cursor:pointer; font-size:12.5px; font-weight:500; transition:background .12s, border-color .12s}
.btn:hover{border-color:var(--muted); background:var(--raised)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px; font-size:11.5px}
.btn.ghost{background:none; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--ink); background:var(--raised)}

/* forms */
label.f{display:flex; flex-direction:column; gap:4px; min-width:0}
label.f > span{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
input[type=text],input[type=number],select,textarea{
  background:var(--ground); border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 9px; width:100%;
  font-size:13px; transition:border-color .12s}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:var(--raised)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,
  :root:not([data-theme="light"]) textarea{background:var(--raised)}}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none}
input[type=number]{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
textarea{resize:vertical; min-height:62px; line-height:1.5}

/* tables */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
   text-align:left; font-weight:500; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
   background:var(--raised)}
td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
tbody tr.total td{border-top:1px solid var(--line); font-weight:600; background:var(--raised)}

/* menu grid */
.menu-row{display:grid; grid-template-columns:76px 1fr 1fr 1fr; gap:1px; background:var(--line-soft)}
.menu-head{display:grid; grid-template-columns:76px 1fr 1fr 1fr; gap:1px; background:var(--line-soft)}
.menu-head > div{background:var(--raised); padding:8px 12px; font-family:var(--f-mono); font-size:9.5px;
                 letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.menu-cell{background:var(--surface); padding:10px 12px; min-width:0}
.menu-day{background:var(--surface); padding:10px 12px; display:flex; flex-direction:column; gap:4px}
.menu-day b{font-family:var(--f-display); font-size:14px; font-weight:600}
.menu-wrap{border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.dishlink{appearance:none; background:none; border:0; padding:0; text-align:left; color:var(--ink); cursor:pointer;
          font-size:13px; line-height:1.45; font-weight:500; border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
          transition:color .12s}
.dishlink:hover{color:var(--accent)}
.menu-cell .plain-txt{color:var(--muted); font-size:12.5px; line-height:1.45}
.menu-cell .meta{margin-top:5px; display:flex; gap:4px; flex-wrap:wrap}

/* eater cards */
.eaters{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.eater{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
       display:flex; flex-direction:column}
.eater-top{display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--line-soft); background:var(--raised)}
.eater-top input[type=text]{background:none; border:0; padding:0; font-weight:600; font-size:14px; font-family:var(--f-display)}
.eater-top .pf{font-family:var(--f-mono); font-size:12px; font-weight:600; color:var(--accent); white-space:nowrap}
.eater-body{padding:13px 14px; display:flex; flex-direction:column; gap:12px}
.f-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.f-row.three{grid-template-columns:repeat(3,1fr)}
.f-row.two{grid-template-columns:repeat(2,1fr)}
.readout{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line-soft); border-radius:var(--r-sm); overflow:hidden}
.readout > div{background:var(--surface); padding:8px 9px; display:flex; flex-direction:column; gap:2px}
.readout .k{font-family:var(--f-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.readout .v{font-family:var(--f-display); font-size:16px; font-weight:600; letter-spacing:-.02em}
.readout .v small{font-size:10px; font-weight:400; color:var(--muted); font-family:var(--f-mono)}
.tagrow{display:flex; gap:5px; flex-wrap:wrap}

/* attendance */
.att{display:grid; grid-template-columns:auto repeat(7,1fr); gap:5px; align-items:center; font-size:12px}
.att .hd{font-family:var(--f-mono); font-size:10px; color:var(--faint); text-align:center; letter-spacing:.06em}
.att .rowlab{font-family:var(--f-mono); font-size:10px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; padding-right:4px}
.slot{appearance:none; border:1px solid var(--line); background:var(--ground); border-radius:var(--r-sm); height:26px;
      cursor:pointer; font-family:var(--f-mono); font-size:10px; color:var(--faint); transition:.1s}
.slot[data-on="1"]{background:var(--accent-wash); border-color:color-mix(in srgb,var(--accent) 45%,transparent); color:var(--accent); font-weight:600}
.slot:hover{border-color:var(--muted)}
.pstrip{display:grid; grid-template-columns:auto repeat(7,1fr); gap:5px; margin-top:7px; align-items:center}
.pstrip .cell{text-align:center; font-family:var(--f-mono); font-size:10.5px; color:var(--muted); padding:3px 0;
              background:var(--raised); border-radius:var(--r-sm)}

/* dish cards */
.dishgrid{display:grid; gap:11px; grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.dish{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; cursor:pointer;
      display:flex; flex-direction:column; gap:9px; text-align:left; transition:border-color .12s, transform .12s}
.dish:hover{border-color:var(--accent); transform:translateY(-1px)}
.dish .dt{display:flex; gap:9px; align-items:flex-start}
.dish .ico{font-size:19px; line-height:1.15}
.dish h3{font-size:13.8px; line-height:1.35; font-weight:600}
.dish .when{font-family:var(--f-mono); font-size:10px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase; margin-top:3px}
.dish .foot{display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-top:auto; padding-top:2px}

/* verdict control */
.vset{display:inline-flex; border:1px solid var(--line); border-radius:100px; overflow:hidden; background:var(--ground)}
.vset button{appearance:none; background:none; border:0; padding:3px 10px; font-size:11px; cursor:pointer; color:var(--muted); font-weight:500}
.vset button:hover{background:var(--raised); color:var(--ink)}
.vset button[aria-pressed="true"]{font-weight:600}
.vset button[data-v="✅ Success"][aria-pressed="true"]{background:var(--good-wash); color:var(--good)}
.vset button[data-v="❌ Failed"][aria-pressed="true"]{background:var(--bad-wash); color:var(--bad)}
.vset button[data-v="Untried"][aria-pressed="true"]{background:var(--raised); color:var(--ink)}

/* board */
.board{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); align-items:start}
.col{background:var(--raised); border:1px solid var(--line); border-radius:var(--r); padding:11px; display:flex; flex-direction:column; gap:9px}
.col > header{display:flex; align-items:center; justify-content:space-between; gap:8px}
.col h3{font-size:12.5px}
.col .n{font-family:var(--f-mono); font-size:11px; color:var(--faint)}
.mini{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 11px; cursor:pointer;
      display:flex; flex-direction:column; gap:6px; text-align:left; width:100%}
.mini:hover{border-color:var(--accent)}
.mini b{font-size:12.5px; font-weight:600; line-height:1.35}
.empty{color:var(--faint); font-size:12px; padding:9px 2px; font-style:italic}

/* shopping */
.shop-line{display:grid; grid-template-columns:24px 1fr auto; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line-soft); align-items:start}
.shop-line:last-child{border-bottom:0}
.shop-line.done .nm{text-decoration:line-through; color:var(--faint)}
.shop-line .nm{font-size:13px; line-height:1.4}
.shop-line .qt{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin-top:2px}
.shop-line .pr{font-family:var(--f-mono); font-size:12.5px; font-weight:500; white-space:nowrap; text-align:right}
.shop-line .src{font-family:var(--f-mono); font-size:9.5px; color:var(--faint); display:block; font-weight:400; margin-top:2px}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer; margin:2px 0 0}
.cat-head{padding:8px 12px; background:var(--raised); font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em;
          text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line-soft)}
.store-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 14px;
            border-bottom:1px solid var(--line); background:var(--raised)}
.store-head h3{font-size:13.5px}
.store-head .tot{font-family:var(--f-mono); font-size:13px; font-weight:600}

/* runsheet */
.run{display:grid; grid-template-columns:58px 1fr auto; gap:12px; padding:11px 13px; border-bottom:1px solid var(--line-soft); align-items:start}
.run:last-child{border-bottom:0}
.run .t{font-family:var(--f-mono); font-size:12.5px; font-weight:600; color:var(--accent)}
.run .task{font-size:13px; line-height:1.45}
.run.done .task{color:var(--faint); text-decoration:line-through}
.run .lbl{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.06em; padding:2px 7px; border-radius:100px;
          background:var(--raised); color:var(--muted); border:1px solid var(--line); white-space:nowrap}
.run .lbl[data-k="EAT-BY-WED"]{background:var(--warn-wash); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.run .lbl[data-k="FREEZER"]{background:var(--fish-wash); color:var(--fish); border-color:color-mix(in srgb,var(--fish) 26%,transparent)}
.run .ck{display:flex; gap:9px; align-items:flex-start}

/* jars */
.jars{display:grid; gap:11px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.jar{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; display:flex; flex-direction:column; gap:7px}
.jar .id{font-family:var(--f-mono); font-size:10.5px; font-weight:600; color:var(--accent); letter-spacing:.06em}
.jar h3{font-size:13.5px}
.jar .layers{font-size:12.5px; color:var(--ink-2); line-height:1.5}
.jar .row{display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--muted);
          border-top:1px solid var(--line-soft); padding-top:7px; margin-top:auto}

/* drawer */
.scrim{position:fixed; inset:0; background:rgba(10,14,11,.5); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--surface); z-index:50;
        transform:translateX(100%); transition:transform .24s cubic-bezier(.3,.8,.4,1); display:flex; flex-direction:column;
        border-left:1px solid var(--line); box-shadow:var(--shadow); visibility:hidden}
.drawer.open{transform:none; visibility:visible}
.drawer header{display:flex; gap:12px; align-items:flex-start; padding:16px 18px; border-bottom:1px solid var(--line); background:var(--raised)}
.drawer header .ico{font-size:24px; line-height:1}
.drawer header h2{font-size:16.5px; line-height:1.3}
.drawer .body{overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:18px}
.drawer .body h4{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); font-weight:500}
.ing{display:flex; flex-direction:column; gap:1px; margin:0; padding:0}
.ing li{list-style:none; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13.2px; line-height:1.45}
.ing li:last-child{border-bottom:0}
.ing .was{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); margin-left:6px}
ol.steps{margin:0; padding-left:0; counter-reset:s; display:flex; flex-direction:column; gap:10px}
ol.steps li{list-style:none; counter-increment:s; display:grid; grid-template-columns:22px 1fr; gap:10px; font-size:13.2px; line-height:1.55}
ol.steps li::before{content:counter(s); font-family:var(--f-mono); font-size:11px; color:var(--accent); font-weight:600;
                    background:var(--accent-wash); border-radius:5px; height:20px; display:grid; place-items:center; margin-top:1px}
.hnotes{display:flex; flex-direction:column; gap:7px; margin:0; padding:0}
.hnotes li{list-style:none; font-size:12.6px; color:var(--ink-2); line-height:1.5; padding-left:14px; position:relative}
.hnotes li::before{content:"·"; position:absolute; left:4px; color:var(--accent); font-weight:700}
.scalebar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 12px; background:var(--accent-wash);
          border:1px solid color-mix(in srgb,var(--accent) 25%,transparent); border-radius:var(--r-sm); font-size:12.3px}
.scalebar b{font-family:var(--f-mono); font-weight:600; color:var(--accent)}

/* swap control */
.swapbtn{appearance:none; border:1px dashed var(--line); background:none; color:var(--muted); font-size:11px; padding:2px 8px;
  border-radius:100px; cursor:pointer; margin-left:auto}
.swapbtn:hover{border-color:var(--accent); color:var(--accent)}
.picker{margin-top:8px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--raised); padding:6px; display:flex; flex-direction:column; gap:3px}
.picker button{appearance:none; border:0; background:none; text-align:left; padding:6px 8px; border-radius:5px; font-size:12.5px; cursor:pointer; color:var(--ink); display:flex; gap:8px; align-items:baseline}
.picker button:hover{background:var(--surface)}
.picker button[aria-current="true"]{background:var(--accent-wash); color:var(--accent); font-weight:600}
.picker .src{font-family:var(--f-mono); font-size:10px; color:var(--faint); margin-left:auto; white-space:nowrap}
.altgrid{display:grid; gap:11px; grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.alt{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; display:flex; flex-direction:column; gap:9px}
.alt .use{display:flex; gap:4px; flex-wrap:wrap}
.alt .use button{appearance:none; border:1px solid var(--line); background:var(--ground); border-radius:100px; padding:2px 9px; font-size:11px; font-family:var(--f-mono); cursor:pointer; color:var(--muted)}
.alt .use button:hover{border-color:var(--accent); color:var(--accent)}
.alt .use button[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent); font-weight:600}
/* misc */
.toast{position:fixed; bottom:20px; left:50%; transform:translate(-50%,14px); background:var(--ink); color:var(--ground);
       padding:9px 16px; border-radius:100px; font-size:12.5px; opacity:0; pointer-events:none; transition:.2s; z-index:60; font-weight:500}
.toast.show{opacity:1; transform:translate(-50%,0)}
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.filters select{width:auto; min-width:118px; font-size:12px; padding:5px 8px}
details.math{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--ground); padding:0}
:root[data-theme="dark"] details.math{background:var(--raised)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) details.math{background:var(--raised)}}
details.math summary{cursor:pointer; padding:8px 12px; font-size:12px; color:var(--muted); font-weight:500; list-style:none}
details.math summary::-webkit-details-marker{display:none}
details.math summary::before{content:"▸ "; color:var(--accent)}
details.math[open] summary::before{content:"▾ "}
details.math .inner{padding:0 12px 12px; font-size:12px; color:var(--ink-2); line-height:1.6; display:flex; flex-direction:column; gap:7px}
details.math code{font-family:var(--f-mono); font-size:11.2px; background:var(--surface); padding:1px 5px; border-radius:4px; border:1px solid var(--line-soft)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:12.5px}
.kv dt{color:var(--faint); font-family:var(--f-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; padding-top:2px}
.kv dd{margin:0; color:var(--ink-2); line-height:1.5}
pre.brief{font-family:var(--f-mono); font-size:11.4px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
          background:var(--ground); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px; max-height:340px; overflow:auto; margin:0}
:root[data-theme="dark"] pre.brief{background:var(--raised)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) pre.brief{background:var(--raised)}}
.sync{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--faint); font-family:var(--f-mono)}
.dot{width:6px; height:6px; border-radius:50%; background:var(--faint)}
.dot.on{background:var(--good)}
@media (max-width:760px){
  .f-row,.f-row.three{grid-template-columns:repeat(2,1fr)}
  .readout{grid-template-columns:repeat(2,1fr)}
  .menu-head{display:none}
  .menu-row{grid-template-columns:1fr; gap:0}
  .menu-day{flex-direction:row; align-items:baseline; gap:9px; background:var(--raised)}
  .menu-cell{border-top:1px solid var(--line-soft)}
  .menu-cell::before{content:attr(data-slot); display:block; font-family:var(--f-mono); font-size:9px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:4px}
  .app{padding:0 14px 60px}
}
@media (pointer:coarse){            /* phone: bigger targets, no hover-only affordances */
  .slot{height:36px; font-size:12px}
  .tab{padding:12px 15px 13px; font-size:14px}
  .swapbtn,.vset button,.alt .use button{padding:6px 12px; font-size:12.5px}
  .picker button{padding:10px 10px; font-size:13.5px}
  .dishlink{padding:2px 0}
  input[type=checkbox]{width:20px; height:20px}
  .btn{padding:9px 14px}
  .drawer{width:100%}
  .drawer .body{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

ves_p":null,"feeds":[],"reconstructed":null,"verdict":"Untried","notes":"","alternate":false,"key":"breakfast-burritos-gf"}],"prices":{"categories":["Proteins","Vegetarian anchors","Grains / pantry (GF-relevant)","Produce / frozen veg"],"caveats":["Single snapshot: every entry in the file is dated 2026-07-18, from one Walmart.ca scrape using live __NEXT_DATA__ extraction against the Saint-Jérôme reference store. There is no second date to trend against yet, so a dashboard should label these as 'as of 2026-07-18' rather than 'current'.","5 of 41 entries are estimates (source = 'est'), not live-scraped prices: crevettes surgelées (~11,00 $), avoine/gruau (~4,00 $), épinards surgelés (~3,50 $), edamame surgelé écossé (~4,50 $). Treat these as placeholders with roughly +/- 30% uncertainty.","4 entries carry an explicit 'verify in aisle' warning: crevettes surgelées (search blocked), épinards surgelés (search noisy), edamame surgelé écossé. Surface a warning badge on these in any cost estimate.","avoine (gruau) additionally carries a dietary warning, not just a price warning: 'verify GF-certified for Eater B'. It is an estimated price AND an ingredient that may not be safe for the gluten-free eater.","2 entries are price ranges rather than single prices: tofu ferme Sunrise Extra Firm (2,97–3,44 $) and tofu ferme Soyganic Firm/Extra (3,67–3,97 $). price_cad for these is the midpoint (3.21 and 3.82); the original range is preserved in brand_format.","3 entries are explicitly flagged 'promo' — poulet poitrines Prime RWA (11,46 $), porc côtelettes longe Maple Leaf (9,58 $), lait de coco Grace 400 ml (1,47 $). These are sale prices that will not hold; the file's stated purpose is to 'tell a real sale from a shelf price', so do not treat promo prices as the baseline.","Several entries have no unit price at all (tilapia, eggs, tempeh, Unico chickpeas, jasmine rice GV, cremini, lemons, and all estimates), so per-gram scaling of a recipe ingredient is not possible for them — only ex":"M","age":63,"height_cm":175,"weight_kg":82.0,"activity":1.375,"placeholder":true,"breakfast_prepped":false,"label":"Eater C","kcal_per_day":2200,"portion_factor":0.83,"protein_min_g":115,"protein_max_g":131,"fibre_min_g":38,"goal":"maintenance","gf":false,"lactose":false,"spice":"mild","allergies":""},{"id":"e3","name":"Parent 2","sex":"F","age":61,"height_cm":162,"weight_kg":68.0,"activity":1.375,"placeholder":true,"breakfast_prepped":false,"label":"Eater D","kcal_per_day":1700,"portion_factor":0.64,"protein_min_g":95,"protein_max_g":109,"fibre_min_g":25,"goal":"maintenance","gf":false,"lactose":false,"spice":"mild","allergies":""}],"math":{"bmr_formula_male":"Mifflin-St Jeor, male: BMR = (10 x weight_kg) + (6.25 x height_cm) - (5 x age) + 5. HOUSEHOLD.md names the formula ('Estimates via Mifflin-St Jeor at light-moderate activity (x1.4), maintenance calories'); the +5 / -161 sex constants are the standard published Mifflin-St Jeor terms and are NOT written out in the file - they are inferred, and they reproduce the recorded kcal exactly (see worked examples).","bmr_formula_female":"Mifflin-St Jeor, female: BMR = (10 x weight_kg) + (6.25 x height_cm) - (5 x age) - 161. Same status as the male formula: the -161 constant is inferred from standard Mifflin-St Jeor, not spelled out in HOUSEHOLD.md, and it reproduces the recorded 1,700 kcal exactly.","activity_multiplier":1.4,"activity_description":"x1.4 = 'light-moderate activity', applied to BMR to give maintenance calories (TDEE = BMR x 1.4). Stated verbatim in HOUSEHOLD.md's EATERS & TARGETS preamble. Same multiplier for both eaters. HOUSEHOLD.md adds: 'Recompute if weight, activity, or goal changes.' The recorded kcal/day values are the x1.4 products ROUNDED TO THE NEAREST 50 and written with a '~' (2,647.05 -> ~2,650; 1,685.6 -> ~1,700). The rounding step itself is implied by the numbers, not stated as a rule.","portion_factor_rule":"EXACT RULE AS ENCODED: HOUSEHOLD.md records the portion factors as literal values only - Eater A = 1.00 P, Eater B = 0.64 P - and MealPrepChef.md says only 'Eater A = 1.00 P, Eater B = factor in HOUSEHOLD.md'. THE DERIVATION IS IMPLIED, NOT WRITTEN: portion_factor = eater_kcal_per_day / primary_eater_kcal_per_day, rounded to 2 decimals, with the primary eater pinned at 1.00. Arithmetic for the two current eaters: Eater A = 2650 / 2650 = 1.000 -> 1.00 P (recorded 1.00 P, match). Eater B = 1700 / 2650 = 0.64150943... -> 0.64 P (recorded 0.64 P, match). Cross-check on unrounded TDEE: 1685.6 / 2647.05 = 0.63678... -> 0.64 P, also a match, so both the rounded-kcal ratio and the raw-TDEE ratio land on the recorded 0.64 and the file does not distinguish between them. A dashboard should use the rounded-kcal ratio (those are the targets visible to the user). USE: portion units per meal slot = sum of the portion factors of the eaters attending that slot. With both eaters in all 21 slots the W29 brief header reads 'portion 1.64 P/meal' (1.00 + 0.64 = 1.64), confirming the additive use.","protein_rule":"EXACT RULE AS ENCODED: HOUSEHOLD.md records protein as a RANGE per eater, not a formula - Eater A 130-145 g/day, Eater B 70-80 g/day. THE g/kg RELATION IS IMPLIED, NOT WRITTEN. Derived from the recorded targets: Eater A 130/90.7 = 1.433 g/kg to 145/90.7 = 1.599 g/kg (midpoint 137.5 g = 1.516 g/kg); Eater B 70/50 = 1.40 g/kg to 80/50 = 1.60 g/kg (midpoint 75 g = 1.50 g/kg). Both eaters therefore sit on the SAME implied band of about 1.4-1.6 g protein per kg bodyweight, centred on ~1.5 g/kg. A dashboard can recompute as protein_min_g = round(1.4 x weight_kg), protein_max_g = round(1.6 x weight_kg): this reproduces Eater B exactly (70 / 80) and Eater A to within 3 g at the low end (127 vs recorded 130) and exactly at the top (145), so the recorded A-range is rounded slightly upward at its floor. The W29 brief reports single midpoint figures: 'A: 2650 / 137 g pro' and 'B: 1700 / 75'.","fibre_rule":"EXACT RULE AS ENCODED: HOUSEHOLD.md records floors only - Eater A >= 38 g/day, Eater B >= 25 g/day. NO DERIVATION IS WRITTEN. These are exactly the standard adult DRI Adequate Intake values for fibre (38 g/day men 19-50, 25 g/day women 19-50), so the rule is implied to be 'DRI AI by sex and age band' - a flat per-person floor, not something scaled off bodyweight or calories. Sanity check against a per-calorie rule: 38/2.650 = 14.34 g per 1000 kcal and 25/1.700 = 14.71 g per 1000 kcal - close to the common 14 g/1000 kcal heuristic but NOT an exact fit (14 g/1000 kcal would give 37.1 g and 23.8 g), so a dashboard should treat fibre as a fixed per-eater floor, not a computed value. Fibre is a MINIMUM (>=), unlike kcal (a target) and protein (a range).","meal_split":"B 25% / L 30% / D 35% / snack 10% of the day's kcal target - identical for both eaters ('same' in Eater B's column). Sums to 100%. Applied to the recorded kcal: Eater A 2650 -> breakfast 662.5, lunch 795, dinner 927.5, snack 265 kcal. Eater B 1700 -> breakfast 425, lunch 510, dinner 595, snack 170 kcal. HOUSEHOLD.md gives the percentages only; the kcal products above are the straightforward multiplication, not values written in the file.","worked_examples":["EATER A (Marlin) - M, 90.7 kg, 183 cm, 33 y. BMR = (10 x 90.7) + (6.25 x 183) - (5 x 33) + 5 = 907 + 1143.75 - 165 + 5 = 1890.75 kcal. TDEE = 1890.75 x 1.4 = 2647.05 kcal -> rounded to nearest 50 = ~2,650 kcal/day. MATCHES the recorded '~2,650'.","EATER B (guest) - F, 50 kg, 160 cm, 27 y. BMR = (10 x 50) + (6.25 x 160) - (5 x 27) - 161 = 500 + 1000 - 135 - 161 = 1204.0 kcal. TDEE = 1204.0 x 1.4 = 1685.6 kcal -> rounded to nearest 50 = ~1,700 kcal/day. MATCHES the recorded '~1,700'.","PORTION FACTOR - Eater A: 2650 / 2650 = 1.00 P (recorded 1.00 P). Eater B: 1700 / 2650 = 0.6415 -> 0.64 P (recorded 0.64 P). Both eaters attending one slot = 1.00 + 0.64 = 1.64 portion units, exactly the '1.64 P/meal' printed in the W29 brief header.","PROTEIN g/kg - Eater A: 130 g / 90.7 kg = 1.43 g/kg (low end), 145 g / 90.7 kg = 1.60 g/kg (high end). Eater B: 70 g / 50 kg = 1.40 g/kg, 80 g / 50 kg = 1.60 g/kg. Implied shared band ~1.4-1.6 g/kg, midpoint ~1.5 g/kg.","FIBRE - Eater A floor 38 g (= men 19-50 DRI AI), Eater B floor 25 g (= women 19-50 DRI AI). Per-1000-kcal check: 14.34 (A) and 14.71 (B) - not a constant, confirming these are flat DRI floors rather than a calorie-derived figure.","MEAL SPLIT kcal - Eater A: 0.25 x 2650 = 662.5 breakfast, 0.30 x 2650 = 795 lunch, 0.35 x 2650 = 927.5 dinner, 0.10 x 2650 = 265 snack. Eater B: 0.25 x 1700 = 425 breakfast, 0.30 x 1700 = 510 lunch, 0.35 x 1700 = 595 dinner, 0.10 x 1700 = 170 snack.","TOLERANCE GATE (MealPrepChef.md step 4 NUTRITION PASS): 'Sum daily totals against HOUSEHOLD.md targets; any day off by more than +/-10% gets rebalanced, not footnoted.' That is a 2,385-2,915 kcal daily band for Eater A and 1,530-1,870 kcal for Eater B. The W29 brief's six cooked days (A 2530-2670, B 1619-1709) all sit inside those bands."]},"budget":{"per_day_cad":40,"per_week_cad":280,"interpretation":"$40/day household total for four; restaurant meals outside it.","views_required":["cash-out","consumed"]},"dietPattern":{"summary":"Five home suppers Sun–Thu for all four, chosen on value, flavour and a verified highly-rated source; Fri and Sat are restaurant nights. The household's four requests — shepherd's pie, eggplant lasagna, pork & shrimp dumplings, smash burgers — are full recipes kept as ALTERNATES, swappable into any home supper from the dashboard. Breakfast prepped for Marlin + Adriana; three planned lunches (gỏi cuốn Sun, phở Wed, pupusas Sat), Monday is roast-chicken leftovers, the rest small and improvised.","veg_dinners_target":0,"veg_quality_rule":"No quota. Value and flavour decide.","lunch_rule":"Small and improvised except the planned ones.","breakfast_rule":"Prepped for Marlin + Adriana only.","cuisine_rule":"Any cuisine that's great value and delicious."},"restrictions":{"allergies":"Adriana: gluten-free, hard. Household cooks GF throughout.","gluten":"Every meal GF.","dairy_lactose":"Adriana mild lactose.","spice":"Marlin high; everyone else mild — heat at the table.","fish_sauce":"Confirm the brand is GF.","per_eater":[]},"storeRing":[{"ring":"Prevost (home)","drive":"0-5 min","stores":"IGA on rte 117","role":"closest; flyer-deal cross-check"},{"ring":"Saint-Jerome","drive":"~15 min","stores":"Walmart · Maxi · Super C · Costco","role":"PRIMARY SHOP (Walmart) + deep discounts"},{"ring":"Saint-Sauveur / Piedmont","drive":"~10 min","stores":"IGA · Metro","role":"flyer arbitrage"},{"ring":"Laval / Montreal","drive":"45-75 min","stores":"Marche Hawai (Viet/Asian staples) · Kim Phat · Marche Jean-Talon (in season)","role":"~monthly Viet pantry run"},{"ring":"Costco note","drive":"~15 min (Saint-Jerome)","stores":"Costco","role":"Membership active but access is NOT reliable week-to-week - not a standing stop. Plan ONE bulk-stock run in the plan's first 1-2 weeks (freezer proteins, bulk pantry staples) while access is available; any Costco trip after that is opportunistic, never something the weekly plan depends on."},{"ring":"Flyer cycle","drive":"n/a","stores":"chain sites + Flipp (IGA, Metro, Maxi, Super C, Provigo)","role":"Quebec flyer cycle runs THURSDAY-WEDNESDAY. A Sunday plan sits mid-cycle: price on the live flyer, and note upcoming Thursday flips only if the shop happens Thu or later."},{"ring":"Second-store rule","drive":"n/a","stores":"Walmart is primary","role":"Only add a second store when it saves >$10 or holds an item Walmart does not carry. Shopping list is grouped by store then aisle; each line = qty to buy (net of pantry) · expected price (Walmart reference) · source flag."}],"jarRotation":[],"foodSafety":["Cooked components (including meat/fish/poultry) max 4 FRIDGE-DAYS. Nothing cooked is served past fridge-day 4 - freeze it or slot it into the midweek 20-min refresh.","Poultry and ground meat cooked to 74 C internal.","Whole cuts and fish cooked to 63 C internal.","Mason jars are REFRIGERATED food, never shelf-stable canning; jars 4-5 fridge-days max.","Cooked rice cooled within the hour.","Reheats to steaming (74 C).","Every container gets a label class: EAT-BY-WED / FREEZER / FRESH-FINISH.","Nutrition figures are estimates from standard databases (CNF / USDA), labelled as such - never medical advice, never therapeutic-diet claims.","Never fabricate a price or a stock claim. Every price carries its source (Walmart.ca, flyer + store + date, or PRICE_BOOK 'est.'). Live stock is asserted only where a store site actually showed it; otherwise the line reads 'Walmart reference - verify in aisle' and carries a substitute.","Planning only - no orders placed, no accounts, no logins, no payments. The human shops. Any future online-cart or delivery integration is a human-confirmation item.","BANNED_RECIPES.md is absolute: never propose a dish on it, or a trivial rename of one. If constraints keep steering back to a banned dish, pick a genuinely different one and say why in the plan.","The budget envelope is a hard gate - an over-budget plan does not ship."],"banned":[],"taste":[],"recipeBlockFormat":"The brief MUST end with a '## RECIPES' section - one block per named dish (every dinner + every distinct jar; lunches ONLY if they are a standalone recipe, not a leftover remix), in this exact shape (stable anchors for the sync):\n\n### Dinner · Mon · Gà nướng — charcoal lemongrass chicken thighs\nMETA: cuisine=Vietnamese; diet=Chicken; method=🔥 Grill\nINGREDIENTS: <scaled list>\nMETHOD: <numbered steps>\nNOTES: <GF / spice / lactose / food-safety temps>\n\nHeading grammar parsed by /household-sync: '### <Meal> · <Day(s)> · <Dish name>'. The META line maps 1:1 onto Notion select / multi-select properties: cuisine -> Cuisine, diet -> Diet, method -> Method (multi_select); Meal and Day come from the heading; Verdict is set to 'Untried' at creation and is never overwritten by a forward sync.\n\nFULL PLAN-FILE SCHEMA (strict order, MealPrepChef.md GUARDRAILS): WEEK HEADER (dates · attendance map · envelope · allergy line) · MENU GRID · NUTRITION TABLE per eater · SHOPPING LIST BY STORE · BUDGET RECONCILIATION (cash-out + consumed) · SUNDAY RUN-SHEET · JAR SPECS · RECIPES. Written to shared/briefs/mealprep-YYYY-Wnn.md. Example shopping line: 'IGA (Prévost) — allée 4 · Pois chiches secs 900 g × 1 · 2,99 $ (circulaire 16–22 juil)'."},"baselinePortionUnits":3.11,"planEaterIds":["e0","e1","e2","e3"],"planAttendance":{"e0":{"Sun":{"B":false,"L":false,"D":false},"Mon":{"B":false,"L":false,"D":false},"Tue":{"B":false,"L":true,"D":true},"Wed":{"B":true,"L":true,"D":true},"Thu":{"B":true,"L":true,"D":true},"Fri":{"B":true,"L":true,"D":true},"Sat":{"B":false,"L":false,"D":false}},"e1":{"Sun":{"B":false,"L":false,"D":false},"Mon":{"B":false,"L":false,"D":false},"Tue":{"B":false,"L":true,"D":true},"Wed":{"B":true,"L":true,"D":true},"Thu":{"B":true,"L":true,"D":true},"Fri":{"B":true,"L":true,"D":true},"Sat":{"B":false,"L":false,"D":false}},"e2":{"Sun":{"B":false,"L":false,"D":false},"Mon":{"B":false,"L":false,"D":false},"Tue":{"B":false,"L":true,"D":true},"Wed":{"B":false,"L":true,"D":true},"Thu":{"B":false,"L":true,"D":true},"Fri":{"B":false,"L":true,"D":true},"Sat":{"B":false,"L":false,"D":false}},"e3":{"Sun":{"B":false,"L":false,"D":false},"Mon":{"B":false,"L":false,"D":false},"Tue":{"B":false,"L":true,"D":true},"Wed":{"B":false,"L":true,"D":true},"Thu":{"B":false,"L":true,"D":true},"Fri":{"B":false,"L":true,"D":true},"Sat":{"B":false,"L":false,"D":false}}},"planSlotP":{"Sun":{"B":0,"L":0,"D":0},"Mon":{"B":0,"L":0,"D":0},"Tue":{"B":0,"L":3.11,"D":3.11},"Wed":{"B":1.64,"L":3.11,"D":3.11},"Thu":{"B":1.64,"L":3.11,"D":3.11},"Fri":{"B":1.64,"L":3.11,"D":3.11},"Sat":{"B":0,"L":0,"D":0}},"notion":{"food":"https://app.notion.com/p/3ada26ca033c8010a800f7292e5c9cfb","household":"https://app.notion.com/p/3a1a26ca033c81bc89f6cbf2caab5c40","week":null}}</script>
<script>
"use strict";
const SEED = JSON.parse(document.getElementById('seed-data').textContent);
const W = SEED.week, DISHES = SEED.dishes, HH = SEED.household;
const PLAN_DAYS = W.days_planned || 7;          // a partial block (e.g. Tue–Fri) has a shorter envelope
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MEALS = [["B","Breakfast"],["L","Lunch"],["D","Dinner"]];
const BASE_P = SEED.baselinePortionUnits;          // recipes were written for 1.64 P
const byKey = Object.fromEntries(DISHES.map(d => [d.key, d]));

/* ── nutrition math — mirrors HOUSEHOLD.md exactly ───────────────── */
const ACTIVITY = [[1.2,"Sedentary"],[1.375,"Light"],[1.4,"Light-moderate (house default)"],
                  [1.55,"Moderate"],[1.725,"Active"],[1.9,"Very active"]];
const GOALS = [[0,"Maintain"],[-0.15,"Cut (−15%)"],[0.1,"Bulk (+10%)"]];
const bmr = e => e.sex === "M"
  ? 10*e.weight_kg + 6.25*e.height_cm - 5*e.age + 5
  : 10*e.weight_kg + 6.25*e.height_cm - 5*e.age - 161;
const round50 = n => Math.round(n/50)*50;
function derive(e){
  const b = bmr(e), tdee = b * e.activity, kcal = round50(tdee * (1 + e.goal));
  return { bmr:b, tdee, kcal,
    proteinMin: Math.round(1.4*e.weight_kg), proteinMax: Math.round(1.6*e.weight_kg),
    fibre: e.sex === "M" ? 38 : 25,
    split: { B: kcal*.25, L: kcal*.30, D: kcal*.35, S: kcal*.10 } };
}
const primaryKcal = () => derive(state.eaters[0]).kcal || 1;
const portionFactor = e => e === state.eaters[0] ? 1 : +(derive(e).kcal / primaryKcal()).toFixed(2);

/* ── state ───────────────────────────────────────────────────────── */
function seedEaters(){
  return HH.eaters.map((e,i) => ({
    id: e.id || "e"+i, name: String(e.name).replace(/\s*\(primary\)/,""), sex: e.sex, age: e.age,
    height_cm: e.height_cm, weight_kg: e.weight_kg, activity: e.activity || 1.4, goal: 0,
    gf: !!e.gf, lactose: !!e.lactose, spice: e.spice || "mild", allergies: e.allergies || "",
    placeholder: !!e.placeholder
  }));
}
function seedAttendance(ids){
  const a = {};
  ids.forEach(id => { a[id] = {}; DAYS.forEach(d => a[id][d] = { B:true, L:true, D:true }); });
  return a;
}
const state = {
  eaters: seedEaters(),
  attendance: null,
  budgetPerDay: HH.budget.per_day_cad,
  restaurantNights: W.menu.filter(r => r.is_out).length,
  plantsTarget: 25,
  feedback: {},          // key -> {verdict, notes}
  shopChecked: {},       // idx -> bool
  prepChecked: {},       // idx -> bool
  swaps: {},             // day -> dish key placed in that supper slot (alternates)
  tab: "setup",
  scaleOn: true,
  pbQuery: "",
  dirty: false          // set once the user edits anything, so a late db load can't clobber it
};
state.attendance = SEED.planAttendance
  ? JSON.parse(JSON.stringify(SEED.planAttendance))
  : seedAttendance(state.eaters.map(e => e.id));
DISHES.forEach(d => state.feedback[d.key] = { verdict: d.verdict || "Untried", notes: d.notes || "" });

/* which dish is actually in a supper slot right now (a swap, or the plan's own) */
const supperKey = row => state.swaps[row.day] || row.dinnerKey;
const ALTS = () => DISHES.filter(d => d.alternate && d.meal === "Dinner");
function setSwap(day, key){
  const row = W.menu.find(r => r.day === day); if (!row || row.is_out) return;
  if (!key || key === row.dinnerKey) delete state.swaps[day]; else state.swaps[day] = key;
  saveWeek(); renderAll();
  toast(key && key !== row.dinnerKey ? `${byKey[key].dish} is now ${day}'s supper` : `${day} back to the plan`);
}
/* portion units present at a slot */
function slotP(day, meal){
  return state.eaters.reduce((s,e) =>
    s + ((state.attendance[e.id]?.[day]?.[meal]) ? portionFactor(e) : 0), 0);
}
function eatersAt(day, meal){
  return state.eaters.filter(e => state.attendance[e.id]?.[day]?.[meal]);
}

/* ── number + ingredient scaling ─────────────────────────────────── */
const VULGAR = {0.25:"¼",0.5:"½",0.75:"¾",0.33:"⅓",0.67:"⅔"};
function fmtNum(n, unit){
  if (!isFinite(n)) return String(n);
  const bulk = /^\s*(kg|l)\b/i.test(unit || "");   // 1 kg must not bucket to the nearest 250 g
  if (n >= 100) n = Math.round(n/10)*10;
  else if (n >= 20) n = Math.round(n/5)*5;
  else if (n >= 2)  n = Math.round(n*2)/2;
  else if (bulk)    n = Math.round(n*20)/20;
  else              n = Math.round(n*4)/4;
  const whole = Math.floor(n), frac = +(n - whole).toFixed(2);
  const v = VULGAR[frac];
  if (v) return (whole ? whole : "") + v;
  return String(+n.toFixed(2));
}
/* scale every bare number that sits OUTSIDE parentheses (package sizes stay put) */
function scaleLine(text, f){
  if (!isFinite(f) || Math.abs(f - 1) < 0.02) return { text, changed:false };
  let out = "", buf = "", depth = 0, changed = false, skipped = false;
  const subs = [];
  const flush = () => {
    if (!buf) return;
    out += buf.replace(/(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?)(\s*[a-zA-Z]+)?/g, (m, num, unit) => {
      let v;
      if (num.includes("/")) { const [a,b] = num.split("/").map(s => parseFloat(s.trim())); v = a/b; }
      else v = parseFloat(num.replace(",", "."));
      if (!isFinite(v) || v === 0) return m;
      changed = true; subs.push(num);
      return fmtNum(v * f, unit) + (unit || "");
    });
    buf = "";
  };
  for (const ch of text){
    if (ch === "("){ flush(); depth++; out += ch; }
    else if (ch === ")"){ depth--; out += ch; }
    else if (depth > 0) { if (/\d/.test(ch)) skipped = true; out += ch; }
    else buf += ch;
  }
  flush();
  return { text: out, changed, skipped, subs };
}
/* How a dish scales for the current roster.
   A dinner is batch-cooked: its written quantity also covers the leftover lunches
   listed in its own house notes (d.feeds), so it must scale across ALL of them. */
function dishScale(d, dayOverride){
  if (d.meal === "Breakfast"){
    const jars = d.days.reduce((s,day) => s + eatersAt(day, "B").length, 0);
    return { kind:"jars", jars, factor:1 };
  }
  const day = dayOverride || d.days[0] || Object.keys(state.swaps).find(k => state.swaps[k] === d.key);
  const code = d.meal === "Lunch" ? "L" : "D";
  if (!day) return { kind:"portion", p:BASE_P, covered:BASE_P, basis:BASE_P, feeds:[], factor:1, unplaced:true };
  const feeds = d.feeds || [];
  const p = slotP(day, code);
  const covered = p + feeds.reduce((s,[fd,fm]) => s + slotP(fd, fm), 0);
  const basis = BASE_P * (1 + feeds.length);     // what the written quantity was sized for
  return { kind:"portion", p, covered, basis, feeds, factor: basis ? covered / basis : 0 };
}

/* ── tiny helpers ────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const money = n => (n == null || !isFinite(n)) ? "—" : n.toFixed(2).replace(".", ",") + " $";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* **bold** → <strong>, on escaped text only */
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2000); }
const dietClass = d => d === "Vegetarian" ? "veg" : (d === "Fish" || d === "Seafood") ? "fish" : "plain";
/* jars are assembled on Sunday — a jar's fridge span is its eat-by day index */
const jarSpan = j => Math.max(0, DAYS.indexOf(String(j.eat_by).trim().split(/[\s(]/)[0]) - Math.max(0, DAYS.indexOf(W.prep_day || "Sun")));

/* ── persistence (db capability; page works fully without it) ────── */
let DB = null, dbReady = false;
const slugSafe = s => s.replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").slice(0, 90);
const writeQueue = new Map();
let localOk = false;
const LS = { get(k){ try { const v = localStorage.getItem("mise:"+k); return v ? JSON.parse(v) : null; } catch { return null; } },
             set(k,v){ try { localStorage.setItem("mise:"+k, JSON.stringify(v)); localOk = true; } catch { localOk = false; } } };
function persist(path, data){
  state.dirty = true;
  LS.set(path, data);                       // this device remembers, signed in or not
  if (!DB) { renderSync(); return; }
  writeQueue.set(path, data);
  clearTimeout(persist._t);
  persist._t = setTimeout(async () => {
    const jobs = [...writeQueue.entries()]; writeQueue.clear();
    for (const [p, body] of jobs){
      try { await DB.doc(p).set(body); }
      catch (err){
        if (err && err.code === "unavailable"){
          try { await DB.doc(p).set(body); }          // one retry, per the db contract
          catch { writeQueue.set(p, body); dbReady = false; renderSync(); }
        } else { dbReady = false; renderSync(); }
      }
    }
  }, 700);
}
const saveHousehold = () => persist("state/household", {
  eaters: state.eaters, attendance: state.attendance,
  budgetPerDay: state.budgetPerDay, plantsTarget: state.plantsTarget, planWeek: W.week_id
});
const saveFeedback = k => persist("feedback/" + slugSafe(k), { ...state.feedback[k], dish: byKey[k]?.dish || k });
const saveWeek = () => persist("state/week-" + slugSafe(W.week_id), { shopChecked: state.shopChecked, prepChecked: state.prepChecked, swaps: state.swaps });

async function initDb(){
  try { DB = await window.claude?.use?.("db"); } catch { DB = null; }
  if (!DB) return;
  try {
    const hh = await DB.doc("state/household").get();
    const hhd = hh.exists ? hh.data() : null;
    const sameWeek = hhd && hhd.planWeek === W.week_id;   // a saved roster from an older plan must not override this one
    if (hh.exists && sameWeek && !state.dirty){      // never overwrite edits made while this was loading
      
      const d = hh.data();
      if (Array.isArray(d.eaters) && d.eaters.length) state.eaters = d.eaters;
      if (d.attendance) state.attendance = d.attendance;
      if (typeof d.budgetPerDay === "number") state.budgetPerDay = d.budgetPerDay;
      if (typeof d.plantsTarget === "number") state.plantsTarget = d.plantsTarget;
      state.eaters.forEach(e => { if (!state.attendance[e.id]) state.attendance[e.id] = seedAttendance([e.id])[e.id]; });
    }
    const wk = await DB.doc("state/week-" + slugSafe(W.week_id)).get();
    if (wk.exists){ const d = wk.data(); state.shopChecked = d.shopChecked || {}; state.prepChecked = d.prepChecked || {};
      state.swaps = {}; Object.entries(d.swaps || {}).forEach(([day,k]) => { if (byKey[k]) state.swaps[day] = k; }); }
    const fb = await DB.collection("feedback").get();
    fb.docs.forEach(doc => {
      const d = doc.data(); const hit = DISHES.find(x => slugSafe(x.key) === doc.id);
      if (hit) state.feedback[hit.key] = { verdict: d.verdict || "Untried", notes: d.notes || "" };
    });
    dbReady = true;
  } catch { dbReady = false; }
  renderAll();
}

/* Coverage = what the counted meals supply ÷ the share of that eater's LIVE daily target those meals
   should cover (B 25 · L 30 · D 35; snacks never planned). Recomputes when Setup stats change. */
function coverage(row, e){
  const c = row && row.per ? row.per[e.id] : null;
  if (!c || !c.share) return null;
  let kcal = c.kcal, pro = c.pro, fib = c.fib, counted = c.counted;
  const sw = state.swaps[row.day];
  if (sw && byKey[sw] && c.parts && c.parts.D){                 // swapped supper: replace the D part
    const pf = portionFactor(e), [k,p,f] = byKey[sw].per_p;
    kcal = kcal - c.parts.D.kcal + Math.round(k*pf); pro = pro - c.parts.D.pro + Math.round(p*pf); fib = fib - c.parts.D.fib + Math.round(f*pf);
    counted = counted.replace(/D$/, "D*");
  }
  const exp = derive(e).kcal * c.share;
  return { ...c, kcal, pro, fib, counted, exp, pct: exp ? kcal / exp : null };
}
const inBand = cv => cv && cv.pct != null && cv.pct >= 0.9 && cv.pct <= 1.1;

function renderLedgers(){
  /* 1 — macros: eater-days inside the ±10% band, home-supper days only (restaurant days are partial by design) */
  const homeRows = W.nutrition.filter(r => !r.restaurant && r.per);
  let ok = 0, tot = 0;
  homeRows.forEach(r => state.eaters.forEach(e => { const cv = coverage(r, e); if (cv){ tot++; if (inBand(cv)) ok++; } }));
  const days = { length: tot };
  /* 2 — dollars */
  const env = state.budgetPerDay * PLAN_DAYS, consumed = W.budget.consumed_cad;
  /* 3 — fridge-days: longest jar span (assembled Sunday) against the 4–5 day jar rule */
  const maxSpan = Math.max(0, ...W.jars.filter(j => !j.freezer).map(jarSpan));
  const L = [
    { lab:"Macros", val:`${ok}/${tot}`, sub:"eater-days in ±10%", pct: tot ? ok/tot : 0,
      cls: !tot ? "is-warn" : ok/tot >= 0.8 ? "is-good" : ok/tot >= 0.6 ? "is-warn" : "is-bad" },
    { lab:"Dollars", val:money(consumed), sub:`of ${money(env)}`, pct:Math.min(consumed/env,1),
      cls: consumed <= env ? "is-good" : "is-bad" },
    { lab:"Fridge-days", val:`${maxSpan}`, sub:"longest jar · cap 5", pct:Math.min(maxSpan/5,1),
      cls: maxSpan <= 4 ? "is-good" : maxSpan === 5 ? "is-warn" : "is-bad" }
  ];
  $("#ledgers").innerHTML = L.map(x => `
    <div class="ledger ${x.cls}">
      <span class="lab">${esc(x.lab)}</span>
      <span class="val">${esc(x.val)} <small>${esc(x.sub)}</small></span>
      <span class="bar"><i style="width:${Math.round(x.pct*100)}%"></i></span>
    </div>`).join("");

  $("#weekLabel").textContent = W.week_id + " · " + W.theme.replace(/^🔥\s*/,"🔥 ");
  const present = DAYS.reduce((s,d) => s + MEALS.reduce((t,[m]) => t + (eatersAt(d,m).length ? 1 : 0), 0), 0);
  $("#attendSummary").textContent = `${state.eaters.length} ${state.eaters.length===1?"eater":"eaters"} · ${present}/21 slots`;
}

function buildBrief(){
  const L = [];
  L.push(`MEAL_PREP_CHEF — week request`);
  L.push(`Week: ${W.week_id}  (${W.dates})`);
  L.push(``);
  L.push(`EATERS & TARGETS`);
  state.eaters.forEach(e => {
    const d = derive(e);
    L.push(`  ${e.name} — ${e.sex} ${e.age}y ${e.height_cm}cm ${e.weight_kg}kg · activity ×${e.activity}`);
    L.push(`    ${d.kcal} kcal/day · protein ${d.proteinMin}–${d.proteinMax} g · fibre ≥${d.fibre} g · portion ${portionFactor(e).toFixed(2)} P`);
    const r = [];
    if (e.gf) r.push("gluten-free (hard)");
    if (e.lactose) r.push("mild lactose — favour yogourt grec / fromages affinés");
    r.push(e.spice === "high" ? "chili: high" : "chili: mild — heat on the side");
    if (e.allergies) r.push("allergies: " + e.allergies);
    L.push(`    ${r.join(" · ")}`);
  });
  L.push(``);
  L.push(`ATTENDANCE (portion units per slot)`);
  DAYS.forEach(d => {
    L.push(`  ${d}  B ${slotP(d,"B").toFixed(2)} P · L ${slotP(d,"L").toFixed(2)} P · D ${slotP(d,"D").toFixed(2)} P`);
  });
  L.push(``);
  L.push(`RULES`);
  L.push(`  Envelope: $${state.budgetPerDay}/day household total → $${state.budgetPerDay*PLAN_DAYS}/week. HARD GATE.`);
  L.push(`  Value and flavour first — no vegetarian quota. Any cuisine, as long as it's great value and delicious.`);
  L.push(`  ${state.restaurantNights} supper(s) out at restaurants — not costed, not counted.`);
  L.push(`  Lunches are small and improvised unless named; still count them in nutrition.`);
  L.push(`  Dinners alternate Mediterranean / Vietnamese · lunches = leftover remix · breakfasts = mason jars.`);
  L.push(`  ≥${state.plantsTarget} distinct plants · nothing cooked served past fridge-day 4 · jars 4–5 days.`);
  L.push(`  Poultry/ground 74 °C · whole cuts & fish 63 °C · rice cooled within 1 h.`);
  const banned = DISHES.filter(d => state.feedback[d.key].verdict === "❌ Failed");
  L.push(``);
  L.push(`SCRAP LIST (never propose these, or a trivial rename)`);
  L.push(banned.length ? banned.map(d => `  ✗ ${d.dish}${state.feedback[d.key].notes ? " — " + state.feedback[d.key].notes : ""}`).join("\n") : `  (none yet)`);
  const loved = DISHES.filter(d => state.feedback[d.key].verdict === "✅ Success");
  L.push(``);
  L.push(`PROVEN (safe to re-run / build around)`);
  L.push(loved.length ? loved.map(d => `  ✓ ${d.dish}${state.feedback[d.key].notes ? " — " + state.feedback[d.key].notes : ""}`).join("\n") : `  (none yet)`);
  const notes = DISHES.filter(d => state.feedback[d.key].notes && state.feedback[d.key].verdict === "Untried");
  if (notes.length){
    L.push(``); L.push(`STANDING NOTES`);
    notes.forEach(d => L.push(`  · ${d.dish} — ${state.feedback[d.key].notes}`));
  }
  L.push(``);
  const alts = ALTS();
  if (alts.length){ L.push(``); L.push(`ALTERNATES (full recipes on file — swap into any supper on request)`);
    alts.forEach(a => L.push(`  · ${a.dish} — ${a.source_name || ""} ${a.source_rating || ""}`)); }
  const sw = Object.entries(state.swaps).filter(([,k]) => byKey[k]);
  if (sw.length){ L.push(``); L.push(`SWAPS IN EFFECT THIS WEEK`); sw.forEach(([d,k]) => L.push(`  ${d} supper → ${byKey[k].dish}`)); }
  L.push(``);
  L.push(`Output: write shared/briefs/mealprep-${W.week_id}.md ending in a ## RECIPES section,`);
  L.push(`one block per named dish: "### <Meal> · <Day(s)> · <Dish name>" + META/INGREDIENTS/METHOD/NOTES.`);
  return L.join("\n");
}
