function openDish(key, day, meal, opts){
  const d = byKey[key]; if (!d) return;
  if (!(opts && opts.keepToggle)) state.scaleOn = true;     // the toggle is per-dish, not sticky
  if (!(opts && opts.keepToggle)) openDish._origin = document.activeElement;
  const sc = dishScale(d, day);
  $("#dwIco").textContent = d.icon || "🍽️";
  $("#dwTitle").textContent = d.dish;
  $("#dwWhen").textContent = `${d.meal} · ${d.days.length ? d.days.join(", ") : (day ? "swapped onto " + day : "alternate — not on the grid")} · ${d.cuisine} · ${d.diet}`;
  const b = $("#dwBody"); b.innerHTML = "";
  b.appendChild(dishArt(d, "art hero"));   /*art-hero*/

  if (d.intro){ const i = el("p","note"); i.style.fontSize = "13px"; i.textContent = d.intro; b.appendChild(i); }

  const bar = el("div","scalebar");
  if (sc.kind === "jars"){
    bar.innerHTML = `<span>Quantities are <b>per serving</b>. This week needs <b>${sc.jars}</b>
      ${sc.jars === 1 ? "serving" : "servings"} — ${esc(d.days.join(", "))} × whoever gets a prepped breakfast.
      A serving is the same for anyone, so a smaller eater's isn't scaled down.</span>`;
  } else if (sc.covered <= 0){
    bar.innerHTML = `<span>Nobody is down for this meal — quantities shown <b>as written</b>. Add someone in Setup to scale it.</span>`;
  } else {
    const feedTxt = (sc.feeds && sc.feeds.length)
      ? ` plus the leftover ${sc.feeds.map(f => f[0] + " lunch").join(" & ")}`
      : "";
    bar.innerHTML = Math.abs(sc.factor - 1) > 0.02
      ? `<span>Written to cover <b>${sc.basis.toFixed(2)} P</b> (this meal${feedTxt}) · you now need
           <b>${sc.covered.toFixed(2)} P</b> → ${state.scaleOn
             ? `scaled <b>× ${sc.factor.toFixed(2)}</b>`
             : `showing the <b>original</b> quantities`}.</span>
         <button class="btn sm" id="tglScale">${state.scaleOn ? "Show original" : "Show scaled"}</button>`
      : `<span>Covering <b>${sc.covered.toFixed(2)} P</b> (this meal${feedTxt}) — matches the quantities as written.</span>`;
  }
  b.appendChild(bar);

  if (d.reconstructed){
    const w = el("div","banner"); w.innerHTML = `<span class="ico">ℹ️</span><div><p>${esc(d.reconstructed)}</p></div>`;
    b.appendChild(w);
  }

  const f = (sc.kind === "jars" || !state.scaleOn || !(sc.covered > 0)) ? 1 : sc.factor;
  const ings = el("div");
  ings.appendChild(el("h4", null, "Ingredients"));
  const ul = el("ul","ing");
  d.ingredients.forEach(line => {
    const r = scaleLine(line, f);
    const li = el("li");
    li.innerHTML = md(r.text)
      + (r.changed && r.subs.length ? ` <span class="was">was ${esc(r.subs.join(", "))}</span>` : "")
      + (!r.changed && r.skipped && f !== 1 ? ` <span class="was">pack size — not scaled</span>` : "");
    ul.appendChild(li);
  });
  ings.appendChild(ul); b.appendChild(ings);

  const st = el("div");
  st.appendChild(el("h4", null, "Method"));
  const ol = el("ol","steps");
  d.steps.forEach(s => { const li = el("li"); li.innerHTML = `<span>${md(s)}</span>`; ol.appendChild(li); });
  st.appendChild(ol); b.appendChild(st);

  if ((d.house_notes||[]).length){
    const hn = el("div");
    hn.appendChild(el("h4", null, "House notes"));
    const ul2 = el("ul","hnotes");
    d.house_notes.forEach(t => { const li = el("li"); li.innerHTML = md(t); ul2.appendChild(li); });
    hn.appendChild(ul2); b.appendChild(hn);
  }

  /* verdict + notes */
  const fbWrap = el("div");
  fbWrap.appendChild(el("h4", null, "After you cook it"));
  const fb = state.feedback[d.key];
  fbWrap.appendChild(verdictControl(d.key, () => { openDish(key, day, meal, {keepToggle:true}); renderAll(); }));
  const ta = el("textarea"); ta.placeholder = "What you liked, what to change next time — the agent reads this.";
  ta.setAttribute("aria-label", "Notes for " + d.dish);
  ta.value = fb.notes; ta.style.marginTop = "9px";
  ta.oninput = () => { state.feedback[d.key].notes = ta.value; };
  ta.onchange = () => { saveFeedback(d.key); renderAll(); };
  fbWrap.appendChild(ta);
  b.appendChild(fbWrap);

  if (d.source_url){
    const s = el("p","note");
    s.innerHTML = `📖 Source recipe: <a href="${esc(d.source_url)}" target="_blank" rel="noopener">${esc(d.source_name || "link")} ↗</a>`
      + (d.source_rating ? ` <span class="mono" style="color:var(--faint)">${esc(d.source_rating)}</span>` : "");
    b.appendChild(s);
  }
  const nl = el("p","note");
  nl.innerHTML = `<a href="${esc(d.notion_url)}" target="_blank" rel="noopener">Open this card in Notion ↗</a>`;
  b.appendChild(nl);

  const tgl = document.getElementById("tglScale");
  if (tgl) tgl.onclick = () => { state.scaleOn = !state.scaleOn; openDish(key, day, meal, {keepToggle:true}); };

  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open");
}
function closeDrawer(){
  const dw = $("#drawer"), a = document.activeElement;
  if (a && dw.contains(a)){            // commit an in-progress note, then leave the subtree
    if (typeof a.blur === "function") a.blur();
    a.dispatchEvent(new Event("change"));
  }
  dw.classList.remove("open"); dw.setAttribute("aria-hidden","true");
  $("#scrim").classList.remove("open");
  if (openDish._origin && document.body.contains(openDish._origin)) openDish._origin.focus({preventScroll:true});
}

  const mp = el("div","panel");
  mp.innerHTML = W.midweek_notes.map(t =>
    `<p style="padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13px; line-height:1.5">${esc(t)}</p>`).join("");
  mid.appendChild(mp); p.appendChild(mid);

  const jr = el("div","sec");
  jr.innerHTML = `<div class="sec-head"><h2>${esc(W.jars_label || "Breakfast bank")}</h2><span class="hint">${esc(W.jars_hint || ("Prepped on " + (W.prep_day || "Sun") + " for whoever gets a prepped breakfast"))}</span></div>`;
  const jg = el("div","jars");
  W.jars.forEach(j => {
    const key = j.key || DISHES.find(d => d.dish.startsWith(j.id))?.key;
    const key0 = j.key || DISHES.find(d => d.dish.startsWith(j.id))?.key;
    const c = el(key0 ? "button" : "div","jar");
    if (key0) c.style.textAlign = "left";
    const sp = j.freezer ? null : jarSpan(j);
    const spCls = j.freezer ? "fish" : sp <= 4 ? "plain" : sp === 5 ? "warn" : "bad";
    c.innerHTML = `<span class="id">${esc(j.id)} · ${esc(j.days)}</span>
      <h3>${esc(j.name)}</h3>
      <p class="layers">${esc(j.layers)}</p>
      <div class="row"><span>${W.jars_label ? "" : "lid-cup: "}${esc(j.lid_cup)}</span>
        <span class="chip ${spCls} mono">${j.freezer ? "freezer" : sp + " fridge-days" + (sp > 5 ? " · over cap" : "")}</span></div>`;
    if (key){ c.style.cursor = "pointer"; c.onclick = () => openDish(key); }
    jg.appendChild(c);
  });
  jr.appendChild(jg); p.appendChild(jr);

  const fs = el("div","sec");
  fs.innerHTML = `<div class="sec-head"><h2>Food safety</h2></div>`;
  const fp = el("div","panel");
  fp.innerHTML = `<p style="font-size:13px; line-height:1.7">${esc(W.food_safety)}</p>`;
  fs.appendChild(fp); p.appendChild(fs);
}

/* A verdict control usable anywhere, not just at the bottom of a recipe. */
function verdictControl(key, onDone){
  const vs = el("div","vset");
  ["Untried","✅ Success","❌ Failed"].forEach(v => {
    const btn = el("button", null, v === "Untried" ? "Untried" : v);
    btn.dataset.v = v;
    btn.setAttribute("aria-pressed", String(state.feedback[key].verdict === v));
    btn.setAttribute("aria-label", `${v} — ${byKey[key] ? byKey[key].dish : key}`);
    btn.onclick = ev => {
      ev.stopPropagation();
      state.feedback[key].verdict = v; saveFeedback(key);
      toast(v === "❌ Failed" ? "Scrapped — it won't be suggested again"
          : v === "✅ Success" ? "Marked a keeper" : "Reset to untried");
      if (onDone) onDone(); else renderAll();
    };
    vs.appendChild(btn);
  });
  return vs;
}

/* ── FEEDBACK ────────────────────────────────────────────────────── */
function renderFeedback(){
  const p = $("#pane-feedback"); p.innerHTML = "";
  const sec = el("div","sec");
  sec.innerHTML = `<div class="sec-head"><h2>How the loop works</h2></div>`;
  const how = el("div","panel");
  how.innerHTML = `<ol style="margin:0; padding-left:19px; display:flex; flex-direction:column; gap:7px; font-size:13px; line-height:1.55">
    <li>After you cook a dish, open its card and set <b>Verdict</b> → ✅ Success or ❌ Failed, and jot <b>Notes</b>.</li>
    <li>Next time the agent plans, the brief carries your notes and verdicts back to it.</li>
    <li><b>Anything marked ❌ Failed is scrapped — the agent never suggests that recipe again.</b> ✅ Success plus your
        notes teach it what to lean into.</li></ol>`;
  sec.appendChild(how); p.appendChild(sec);

  const board = el("div","sec");
  board.innerHTML = `<div class="sec-head"><h2>Triage</h2><span class="hint">Tap a card to open it and set a verdict.</span></div>`;
  const b = el("div","board");
  [["Untried","plain"],["✅ Success","good"],["❌ Failed","bad"]].forEach(([v,cls]) => {
    const items = DISHES.filter(d => state.feedback[d.key].verdict === v);
    const col = el("div","col");
    col.innerHTML = `<header><h3>${esc(v)}</h3><span class="n">${items.length}</span></header>`;
    if (!items.length) col.appendChild(el("p","empty", v === "Untried" ? "Everything judged." : "Nothing here yet."));
    items.forEach(d => {
      const m = el("button","mini");
      m.innerHTML = `<b>${esc(d.icon||"")} ${esc(d.dish)}</b>
        <div style="display:flex; gap:5px; flex-wrap:wrap">
          <span class="chip ${dietClass(d.diet)}">${esc(d.diet)}</span>
          <span class="chip plain">${esc(d.cuisine)}</span></div>
        ${state.feedback[d.key].notes ? `<p class="note">"${esc(state.feedback[d.key].notes)}"</p>` : ""}`;
      m.onclick = () => openDish(d.key);
      const wrap = el("div"); wrap.style.cssText = "display:flex; flex-direction:column; gap:6px";
      wrap.appendChild(m);
      wrap.appendChild(verdictControl(d.key));
      col.appendChild(wrap);
    });
    b.appendChild(col);
  });
  board.appendChild(b); p.appendChild(board);

  /* ban list export */
  const banned = DISHES.filter(d => state.feedback[d.key].verdict === "❌ Failed");
  const loved = DISHES.filter(d => state.feedback[d.key].verdict === "✅ Success");
  const ex = el("div","sec");
  ex.innerHTML = `<div class="sec-head"><h2>Write back to the agent's files</h2>
    <span class="hint">Paste into BANNED_RECIPES.md and TASTE_NOTES.md, or let <code>/household-sync</code> do it.</span></div>`;
  const xp = el("div","panel");
  const banTxt = banned.length
    ? banned.map(d => `- ${d.dish} · scrapped ${todayISO()} · ${state.feedback[d.key].notes || "no reason given"}`).join("\n")
    : "(none yet — nothing has been marked ❌ Failed)";
  const tasteTxt = loved.length || DISHES.some(d => state.feedback[d.key].notes)
    ? [...loved.map(d => `${todayISO()} · ${d.dish} · ✅ worked${state.feedback[d.key].notes ? " — " + state.feedback[d.key].notes : ""}`),
       ...DISHES.filter(d => state.feedback[d.key].notes && state.feedback[d.key].verdict !== "✅ Success")
         .map(d => `${todayISO()} · ${d.dish} · ${state.feedback[d.key].notes}`)].join("\n")
    : "(none yet)";
  const pre1 = el("pre","brief"); pre1.textContent = "## Scrapped\n" + banTxt;
  const pre2 = el("pre","brief"); pre2.textContent = "## Loved / notes\n" + tasteTxt;
  pre2.style.marginTop = "10px";
  const row = el("div"); row.style.cssText = "display:flex; gap:8px; margin-top:11px; flex-wrap:wrap";
  const c1 = el("button","btn","Copy scrap list");
  c1.onclick = async () => { try { await navigator.clipboard.writeText(banTxt); toast("Scrap list copied"); } catch { toast("Copy manually"); } };
  const c2 = el("button","btn","Copy taste notes");
  c2.onclick = async () => { try { await navigator.clipboard.writeText(tasteTxt); toast("Taste notes copied"); } catch { toast("Copy manually"); } };
  row.append(c1,c2);
  xp.append(pre1, pre2, row);
  ex.appendChild(xp);
  p.appendChild(ex);
  p.appendChild(syncNode());
}
const todayISO = () => new Date().toISOString().slice(0,10);

function syncNode(){
  const n = el("div","sync");
  n.innerHTML = `<span class="dot${(dbReady || localOk) ? " on" : ""}"></span>
    <span>${dbReady ? "Changes saved for next visit" : localOk ? "Saved on this device — other devices won't see them" : "Working locally — changes last for this visit only"}</span>`;
  return n;
}
function renderSync(){ document.querySelectorAll(".sync").forEach(n => n.replaceWith(syncNode())); }

/* ── boot ────────────────────────────────────────────────────────── */
function renderAll(){
  const a = document.activeElement;
  const fk = a && a.dataset ? a.dataset.fk : null;
  const caret = (a && typeof a.selectionStart === "number") ? a.selectionStart : null;
  renderTabs(); renderLedgers();
  if (state.tab === "setup") renderSetup();
  if (state.tab === "week") renderWeek();
  if (state.tab === "recipes") renderRecipes();
  if (state.tab === "shopping") renderShopping();
  if (state.tab === "prep") renderPrep();
  if (state.tab === "feedback") renderFeedback();
  if (fk){
    const back = document.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]');
    if (back){ back.focus({preventScroll:true});
      if (caret != null && typeof back.setSelectionRange === "function"){
        try { back.setSelectionRange(caret, caret); } catch {}
      } }
  }
}
$("#dwClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
/* This device's own memory (works without any sign-in). A saved roster only applies to the plan it was made for. */
function loadLocal(){
  const hh = LS.get("state/household");
  if (hh && hh.planWeek === W.week_id){
    if (Array.isArray(hh.eaters) && hh.eaters.length) state.eaters = hh.eaters;
    if (hh.attendance) state.attendance = hh.attendance;
    if (typeof hh.budgetPerDay === "number") state.budgetPerDay = hh.budgetPerDay;
    if (typeof hh.plantsTarget === "number") state.plantsTarget = hh.plantsTarget;
    state.eaters.forEach(e => { if (!state.attendance[e.id]) state.attendance[e.id] = seedAttendance([e.id])[e.id]; });
    localOk = true;
  }
  const wk = LS.get("state/week-" + slugSafe(W.week_id));
  if (wk){ state.shopChecked = wk.shopChecked || {}; state.prepChecked = wk.prepChecked || {};
    state.swaps = {}; Object.entries(wk.swaps || {}).forEach(([d,k]) => { if (byKey[k]) state.swaps[d] = k; }); localOk = true; }
  DISHES.forEach(d => { const f = LS.get("feedback/" + slugSafe(d.key)); if (f) { state.feedback[d.key] = { verdict: f.verdict || "Untried", notes: f.notes || "" }; localOk = true; } });
}
loadLocal();
renderAll();
initDb();
</script>
